ai:
  # provider: gemini | openai | claude. 모델 이름은 provider 별 키에 둔다
  # (gemini → vision_model/chat_model, openai → openai_*_model, claude → claude_*_model).
  # 고른 provider 의 키가 없으면 Gemini 로 대체된다.
  vision_provider: gemini
  vision_model: gemini-2.5-flash
  # 채팅: 2026-10 샘플 영상 비교에서 gpt-6-luna 가 발화 반응·자연스러움 1위, 비용은 flash-lite 수준.
  chat_provider: openai
  chat_model: gemini-2.5-flash-lite
  openai_vision_model: gpt-6-luna
  openai_chat_model: gpt-6-luna
  api_key_env: GEMINI_API_KEY
  profile_model: gemini-2.5-flash
  claude_api_key_env: CLAUDE_API_KEY
  claude_vision_model: claude-sonnet-4-6
  claude_chat_model: claude-haiku-5-5
  # 이미지 분석 프롬프트(묘사/위치/상황/이벤트 형식·분량 규칙).
  # 비워두면 코드 기본값을 사용한다. 설정 'AI 모델' 탭에서 편집/저장.
  vision_prompt: ""
capture:
  interval_seconds: 15
  ssim_threshold: 0.92
  target_window: CrossCode Min v1.4.2-4
  resize_width: 1024
chat:
  batch_size: 5
  context_window: 10
  delay_min: 1.0
  delay_max: 8.0
  persona_dir: personas
  # 소재(클리셰) 쏠림 억제. 한 라운드에서 같은 소재를 쓰는 봇은 최대 topic_round_max 명,
  # 최근 topic_window_rounds 라운드에 자주 나온 소재는 1명으로 제한하고 프롬프트로도 피하게 한다.
  topic_round_max: 2
  topic_window_rounds: 6
  # 부분 문자열로 잡는 클리셰 키워드(한 글자 단어는 다른 단어 속에서도 잡히니 주의).
  cliche_keywords: [렉, 버벅, 프레임, 끊기, 끊김, 서버]
ui:
  # 채팅창 배경 투명도(0~100). 100 = 배경 없이 글자만(외곽 그림자). 오버레이 하단 슬라이더로 조절.
  # (옛 opacity 키는 더 이상 쓰지 않는다 — 없으면 opacity 에서 환산)
  transparency: 15
  # 오래된 메시지를 흐리게 해 새 채팅이 먼저 보이게 한다.
  fade_old: true
  # 채팅창을 화면 캡처(Vision·녹화 프로그램)에서 제외. 봇이 자기 채팅을 화면에서 읽는 것을 막는다.
  exclude_from_capture: true
  # 채팅창에 보관/표시할 최대 줄 수(봇 메시지+STT 인라인 공유). 초과 시 오래된 줄부터 삭제.
  # 설정 '오버레이' 페이지에서 50~500 범위로 조절 가능.
  max_messages: 150
  font_size: 14
  # STT 받아쓰기를 채팅창에 회색 인라인으로 항상 표시(불안정한 STT 확인용).
  # 설정 '오버레이' 페이지 또는 채팅창 우클릭 메뉴로 토글.
  show_stt_history: false
  width: 380
  height: 640
  window_excludes:
  - '%Discord%'
  - '%NVIDIA%'
  - '%Snipping Tool%'
  - C:\Windows%
  - C:\Users%
  - '%Firefox'
  - D:\%
  - E:\%
  - PowerToys%
  - Steam%
  - 설정
  - 카카오톡
  - 명령%
  - '%파일 탐색기'
  - '%입력 환경'
  - '%Visual Studio Code'
  - python
  - Program Manager
  - RzMonitor%
stt:
  enabled: true
  sample_rate: 16000
  device: default
  vad_threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 500
  speech_pad_ms: 200
  max_utterance_seconds: 30.0
  # 기본은 OpenAI gpt-transcribe (2026-10 실측 정확도 91%, gemini-2.5-flash 65%·환각).
  # OpenAI 키가 없으면 Gemini(stt.fallback_model)로 자동 대체된다.
  provider: openai
  openai_api_key_env: OPENAI_API_KEY
  model: gpt-transcribe
  fallback_model: gemini-2.5-flash
  language: ko
  transcribe_prompt: 사용자가 게임을 플레이하며 한국어로 혼잣말/감상을 말합니다. 짧은 감탄사도 그대로 옮겨 적으세요.
  lookback_seconds: 20.0
  min_transcript_chars: 2
  default_weight: high
  input_gain: 1.0
  normalize_target_level: 0.1
  normalize_percentile: 95
  normalize_max_gain: 20.0
logging:
  save_to_file: true

# 채팅 외부 출력. solo_stream 의 채팅을 외부 소비자(예: project_ns AI 스트리머)에게
# WebSocket 으로 내보낸다. 기본 비활성이며, 켜도 오버레이 동작에는 영향이 없다
# (부가 출력이고 전송 실패는 조용히 무시한다).
export:
  websocket:
    enabled: false       # 명시적으로 켜야 동작. 끄면 서버를 아예 띄우지 않는다.
    host: 127.0.0.1
    port: 8765
