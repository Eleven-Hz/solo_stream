ai:
  vision_provider: gemini
  vision_model: gemini-2.5-flash
  chat_model: gemini-2.5-flash-lite
  api_key_env: GEMINI_API_KEY
  profile_model: gemini-2.5-flash
  claude_api_key_env: CLAUDE_API_KEY
  claude_vision_model: claude-sonnet-4-6
  claude_chat_model: claude-sonnet-4-6
capture:
  interval_seconds: 15
  ssim_threshold: 0.92
  target_window: CrossCode Min v1.4.2-4
  resize_width: 1024
chat:
  batch_size: 5
  context_window: 10
  delay_min: 1.0
  delay_max: 8.0
  persona_dir: personas
ui:
  opacity: 0.85
  max_messages: 50
  font_size: 14
  width: 392
  height: 875
  window_excludes:
  - '%Discord%'
  - '%NVIDIA%'
  - '%Snipping Tool%'
  - C:\Windows%
  - C:\Users%
  - '%Firefox'
  - D:\%
  - E:\%
  - PowerToys%
  - Steam%
  - 설정
  - 카카오톡
  - 명령%
  - '%파일 탐색기'
  - '%입력 환경'
  - '%Visual Studio Code'
  - python
  - Program Manager
  - RzMonitor%
stt:
  enabled: true
  sample_rate: 16000
  device: default
  vad_threshold: 0.5
  # 캡처 단계 입력 게인 (1.0=변경 없음). 마이크가 작게 잡히면 1.5~3.0 으로 올려
  # VAD 감지율과 transcribe 신호 레벨을 함께 높인다. 너무 키우면 노이즈도 발화로 오인.
  input_gain: 1.0
  # Gemini 전송 직전 퍼센타일 기반 정규화 (0=비활성화).
  # |pcm|의 normalize_percentile 값을 normalize_target_level 로 끌어올린다.
  # peak가 아니라 퍼센타일 기준이라 게임 효과음 같은 한 번의 큰 소리에 흔들리지 않고,
  # 정상 음량(기준≥target)은 건드리지 않는다(boost-only).
  normalize_target_level: 0.1
  normalize_percentile: 95
  # 정규화 게인 상한. 무음/노이즈가 과증폭되는 것을 막는다.
  normalize_max_gain: 20.0
  min_speech_ms: 250
  min_silence_ms: 500
  speech_pad_ms: 100
  max_utterance_seconds: 30.0
  model: gemini-2.5-flash
  language: ko
  transcribe_prompt: 사용자가 게임을 플레이하며 한국어로 혼잣말/감상을 말합니다. 짧은 감탄사도 그대로 옮겨 적으세요.
  lookback_seconds: 20.0
  min_transcript_chars: 2
  default_weight: high
