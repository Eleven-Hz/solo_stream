ai:
  vision_provider: gemini
  vision_model: gemini-2.5-flash
  chat_model: gemini-2.5-flash-lite
  api_key_env: GEMINI_API_KEY
  profile_model: gemini-2.5-flash
  claude_api_key_env: CLAUDE_API_KEY
  claude_vision_model: claude-sonnet-4-6
  claude_chat_model: claude-sonnet-4-6
  # 이미지 분석 프롬프트(묘사/위치/상황/이벤트 형식·분량 규칙).
  # 비워두면 코드 기본값을 사용한다. 설정 'AI 모델' 탭에서 편집/저장.
  vision_prompt: ""
capture:
  interval_seconds: 15
  ssim_threshold: 0.92
  target_window: CrossCode Min v1.4.2-4
  resize_width: 1024
chat:
  batch_size: 5
  context_window: 10
  delay_min: 1.0
  delay_max: 8.0
  persona_dir: personas
ui:
  opacity: 0.85
  max_messages: 50
  font_size: 14
  # STT 받아쓰기를 채팅창에 회색 인라인으로 항상 표시(불안정한 STT 확인용).
  # 설정 '음성' 탭 또는 채팅창 우클릭 메뉴로 토글.
  show_stt_history: false
  width: 450
  height: 875
  window_excludes:
  - '%Discord%'
  - '%NVIDIA%'
  - '%Snipping Tool%'
  - C:\Windows%
  - C:\Users%
  - '%Firefox'
  - D:\%
  - E:\%
  - PowerToys%
  - Steam%
  - 설정
  - 카카오톡
  - 명령%
  - '%파일 탐색기'
  - '%입력 환경'
  - '%Visual Studio Code'
  - python
  - Program Manager
  - RzMonitor%
stt:
  enabled: true
  sample_rate: 16000
  device: default
  vad_threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 500
  speech_pad_ms: 200
  max_utterance_seconds: 30.0
  provider: gemini
  openai_api_key_env: OPENAI_API_KEY
  model: gemini-2.5-flash
  language: ko
  transcribe_prompt: 사용자가 게임을 플레이하며 한국어로 혼잣말/감상을 말합니다. 짧은 감탄사도 그대로 옮겨 적으세요.
  lookback_seconds: 20.0
  min_transcript_chars: 2
  default_weight: high
  input_gain: 1.0
  normalize_target_level: 0.1
  normalize_percentile: 95
  normalize_max_gain: 20.0
logging:
  save_to_file: true
