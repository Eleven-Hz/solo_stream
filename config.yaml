ai:
  # 이미지 분석 제공자: "gemini" 또는 "claude"
  vision_provider: gemini
  vision_model: gemini-2.5-flash
  chat_model: gemini-2.5-flash-lite
  api_key_env: GEMINI_API_KEY
  # 게임 프로필 자동 생성 모델 (Google Search grounding 지원 Gemini만 가능)
  profile_model: gemini-2.5-flash
  # Claude 설정 (vision_provider: claude 일 때 사용)
  claude_api_key_env: CLAUDE_API_KEY
  claude_vision_model: claude-sonnet-4-6
  claude_chat_model: claude-sonnet-4-6
capture:
  interval_seconds: 15
  ssim_threshold: 0.92
  target_window: CrossCode Min v1.4.2-4
  resize_width: 1024
chat:
  batch_size: 5     # 라운드당 풀에서 무작위로 뽑아 발언시킬 봇 수

  context_window: 10
  delay_min: 1.0
  delay_max: 8.0
  persona_dir: personas
ui:
  opacity: 0.85
  max_messages: 50
  font_size: 14
  width: 392
  height: 875
  window_excludes:
  - '%Discord%'
  - '%NVIDIA%'
  - '%Snipping Tool%'
  - C:\Windows%
  - C:\Users%
  - '%Firefox'
  - D:\%
  - E:\%
  - PowerToys%
  - Steam%
  - 설정
  - 카카오톡
  - 명령%
  - '%파일 탐색기'
  - '%입력 환경'
  - '%Visual Studio Code'
  - python
  - Program Manager
  - RzMonitor%
stt:
  enabled: false
  mode: vad
  vad_threshold: 0.5
