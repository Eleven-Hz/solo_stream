name: Neverness to Everness (이환)
description: Hotta Studio(Perfect World Games의 자회사)에서 개발한 초자연 오픈월드 액션 RPG이다. 플레이어는
  초현실적인 대도시 헤테로에서 '이상 현상 사냥꾼'이 되어 도시를 탐험하고 'Anomaly'라는 초자연적 존재와 맞서 싸우게 된다. 높은 자유도를
  가진 탐험, 4인 팀 전투, 도시 생활 시뮬레이션 및 경영 요소가 특징이다.
vision_focus:
- 환경 및 지형 특성 (배경 색상, 지형 유형, 구조물 밀집도 — 숲/산/강/사막/도시 등)
- 플레이어 캐릭터 상태 (체력/마나/스태미너 바, 장착 장비 외형, 현재 적용 버프/디버프 아이콘)
- 적대적 개체 정보 (적 종류/수, 체력 바, 공격 또는 상태 효과 시각적 표현 — 독/화상/빙결 등)
- 화면에 표시되는 자원/아이템 (광물/식물/보급품 등 자원 유형별 색상 및 형태, 드랍된 아이템 아이콘)
- 주요 UI 요소 (미니맵 위치/표식, 인벤토리 아이콘, 퀘스트/목표 추적기, 대화창 내용)
- 특수 효과 및 알림 (스킬 사용 이펙트, 환경 효과 — 비/눈, 시스템 알림 텍스트)
- 상호작용 가능한 요소 (클릭/선택 가능한 UI 버튼, 오브젝트의 강조 효과, 문/레버 등 제어 장치)
systems:
- '실시간 액션 RPG 전투 (Real-time Action RPG Combat): 플레이어가 네 명의 캐릭터로 팀을 구성하여 실시간으로 액션 전투를
  진행하며, 전투 중 캐릭터를 자유롭게 교체할 수 있습니다.'
- '캐릭터 교체 시스템 (Character Swapping System): 쿨다운 없이 필드의 4개 캐릭터를 자유롭게 교체할 수 있으며, 캐릭터가
  빛날 때 교체하면 에스퍼 스킬(Esper Skill)이 활성화됩니다.'
- '회피 및 패리 (Dodge & Parry): 적의 공격을 피하거나 막아내는 핵심 방어 메커니즘으로, 완벽한 회피는 치명적인 반격(Critical
  Riposte)을, 패리는 에스퍼 미터(Esper Meter)를 즉시 채워줍니다.'
- '에스퍼 사이클 시스템 (Esper Cycle System): 각 캐릭터에 할당된 6가지 에스퍼 타입(Esper Type)을 기반으로 하는 독특한
  원소 시스템으로, 인접한 에스퍼 타입의 캐릭터가 에스퍼 미터가 가득 찬 상태에서 교체될 때 반응을 일으킵니다.'
- '속성 반응 (Elemental Reactions / Esper Cycle Reactions): 에스퍼 사이클에서 인접한 에스퍼 타입을 조합하여
  발동하는 다양한 효과로, 전투에서 전술적 이점을 제공합니다 (예: Blossom, Hexed, Scorch, Remora, Stain).'
- '에스퍼 미터 (Esper Meter): 캐릭터의 HP 및 궁극기 게이지 옆에 위치하며, 일반 공격, 스킬 사용, 그리고 완벽한 패리를 통해 충전되어
  에스퍼 스킬 발동의 기반이 됩니다.'
- '궁극기 (Ultimate Skills): 각 캐릭터 고유의 강력한 필살기로, 전투의 흐름을 바꾸거나 대량의 피해를 입힐 수 있습니다.'
- '스태미나 시스템 (Stamina System): 달리기, 점프, 등반, 수영 등 특수 이동 동작을 제한하지만 시간이 지나면 재생되어 탐험과 전투에
  영향을 미칩니다.'
- '스태거 / 브레이크 미터 (Stagger / Break Meter): 적에게 피해를 주거나 특정 행동(완벽한 회피, 패리 등)을 성공시켜 적의
  스태거 게이지를 채우면 적이 잠시 무력화되어 큰 피해를 입힐 수 있습니다.'
- '성장 시스템 (Progression System): 캐릭터 레벨, 무기(Arc) 레벨, 스킬 레벨을 올리고 ''감정 등급(Appraisal Level)''이라는
  계정 레벨을 통해 게임 전반의 파워와 콘텐츠 해금을 진행합니다.'
- '대미지 타입 (Damage Types): 캐릭터마다 고유한 에스퍼 타입(예: Cosmos, Anima, Incantation, Chaos, Psyche,
  Lakshana)에 따른 대미지를 입히며, 이는 캐릭터 빌드와 팀 구성에 중요한 요소입니다.'
- '차량 시스템 (Vehicle System): 스쿠터부터 스포츠카까지 다양한 종류의 차량을 커스터마이징하고 운전하여 도시를 탐험하며, 멀티플레이
  레이스에 참여할 수도 있습니다.'
- '생활 콘텐츠 (Life Skills / Hobbies): 도시 생활을 즐길 수 있는 다양한 요소로, 상점 관리, 낚시, 미니게임 등 여러 가지
  활동을 통해 휴식과 보상을 얻을 수 있습니다.'
locations:
- '헤테로 (Hethereau): 게임의 주요 무대가 되는 광활하고 활기찬 초자연적인 오픈 월드 도시로, 플레이어는 이곳에서 ''감정사''로서 도시의
  미스터리를 해결합니다.'
- '신 헤르랜드 지구 (New Herland District): 헤테로 내의 한 구역으로, 다양한 사이드 퀘스트와 숨겨진 금고가 존재하는 지역입니다.'
- '미구엘 지구 (Miguel District): 헤테로에 위치한 또 다른 구역으로, 전화 부스, 오라클 스톤 등 탐험과 관련된 다양한 요소들을
  찾을 수 있습니다.'
- '반각거리 (Hankaku Street): 오래된 상점들이 늘어서 있고 다양한 인물들과 교류하며 사회적 관계를 넓힐 수 있는 번화한 거리입니다.'
- '에이본 고물상 (Eibon Antique Shop): 플레이어가 ''무허가 이상 현상 사냥꾼''으로서 처음 활동을 시작하고 의뢰를 받는 거점으로,
  동료들과 함께 도시의 이상 현상을 해결하는 본부입니다.'
- '핑크 발톱 은행 본부 (Pink Paws Bank HQ): 도시 내 주요 건물 중 하나로, 막대한 양의 게임 내 재화인 폰(Fons)을 얻을
  수 있는 금고가 숨겨져 있습니다.'
- '미다스 아크 작업장 (Midas Arc Workshop): 폰을 얻을 수 있는 금고가 있는 또 다른 중요한 건물로, 아이템 및 장비와 관련될
  수 있습니다.'
- '헤테로 스카이타워 (Hethereau Skytower): 헤테로의 고층 건물 중 하나로, 탐험을 통해 폰을 발견할 수 있는 금고가 위치해 있습니다.'
- '헤테로 시립 병원 (Hethereau Municipal Hospital): 폰을 얻을 수 있는 금고가 있는 장소 중 하나로, 특정 퀘스트와 연관될
  수 있습니다.'
- '노스릿지 기차역 (Northridge Train Station): 도시 내 주요 교통 허브 중 하나로, 다른 지역으로 이동하는 데 사용되는 기차를
  이용할 수 있습니다.'
- '고스트 트레인 (Ghost Train): 이상 공간(Anomaly space)을 통해 도시 내 특정 지점으로 빠르게 이동할 수 있는 특별한 교통수단이자
  이동 경로입니다.'
- '베르트하이머 타워 (Wertheimer Tower): 헤테로 곳곳에 존재하는 랜드마크 중 하나로, 탐험을 통해 다양한 수집품과 정보를 얻을 수
  있습니다.'
enemies:
- '무두 기사 (Headless Rider): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '바다의 죄수 (Sea Prisoner): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '비트 킹 (Beat King): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '블랙 토메 (Black Tome): 이계 보스.'
- '둥지 속 새 (Nestbound Bird): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '제비꼬리 (Swallowtail): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '세레네티 (Serenetti): 이계 의뢰를 통해 잠금 해제 가능한 이계 보스'
- '맘몬 (Mammon): 속임수 같은 움직임과 공격 회복 속도, 광범위한 지면 강타로 플레이어를 방심하게 만드는 악명 높은 보스이며, 핑크 발바닥
  은행 강도(Pink Paws Bank Heist)의 최종 보스로도 등장한다.'
- '모픽스 (Morphix): 그린 월 슬로프 - 브릿지 크로싱(Green Wall Slope - Bridge Crossings)에서 발견되는 주간
  보스.'
- '통행 정의 (Passage Justice): 경찰 수배도가 4성에 도달하면 등장하는 레벨 99 보스.'
- '그림 없는 액자 보스 (Pictureless Frame Boss): 시네마틱 전투에서 만나는 보스.'
- '이름 없는 병원 몬스터 (Nameless Hospital Monsters): 이름 없는 병원(Nameless Hospital) 던전에서 만나는
  일반 몬스터.'
skills:
- '민트 - 이중 칼날 공격 (Dual Blades Attack): 이중 칼날을 사용하여 토네이도 형태의 광역 공격을 생성한다.'
- '나나리 - 연계 공격 (Follow-up Attack): 추가 피해를 주는 연계 공격을 가하고, 궁극기 사용 중 적들을 모은다. 또한 번개 공격을
  발사할 수 있다.'
- '사키리 - 슬라임 스태프 강타 (Slime Staff Bonk): 슬라임 몬스터가 달린 거대한 스태프를 휘둘러 적을 공격한다.'
- '사키리 - 궁극기: 괴물 토사물 (Ultimate: Monster Vomit): 스태프 끝에 달린 괴물을 이용해 광범위한 토사물 공격을 가한다.'
- '바이창 - 원거리 주문 공격 (Ranged Spell Attacks): 마법 캐릭터로서 원거리에서 주문 공격을 사용하며, 근접하여 주먹과 발차기도
  사용한다.'
- '스키아 - 그림자 변신 (Shadow Transformation): 늑대인간 형태로 적을 발톱과 이빨로 공격하며, 잉크빛 그림자 웅덩이로 변신하여
  적을 통과하며 피해를 입힌다.'
- '스키아 - 궁극기: 그림자 웅덩이 점화 (Ultimate: Ignite Shadow Pool): 그림자 웅덩이를 점화시켜 공격한다.'
- '라크리모사 - 파괴 상태 추가 피해 (Broken State Bonus Damage): 적이 파괴 상태일 때 추가 피해를 입히고, 광역 카오스
  피해 및 지속 피해를 가한다.'
- '라크리모사 - 쓰레기통 개 변신 (Trash-can Dog Transformation): 쓰레기통 개로 변신하여 불타는 쓰레기를 뱉어 공격한다.'
- '아들러 - 소각 디버프 (Scorch Debuff): 적에게 소각 상태를 부여하여 다양한 디버프를 적용하고, 아군에게 보호막을 생성하며 주술
  피해를 입힌다.'
- '파디아 - 생명력 흡수 및 HP 증가 (Life Drain & HP Boost): 거대한 묘비 무기를 사용하고 흡혈귀 같은 무술 스타일로 싸우며,
  아군이 대상으로부터 최대 HP를 흡수하게 하고 팀의 최대 HP를 증가시킨다.'
- '호토리 - 유령 난초 문장 [블라썸] 강화 (Ghost Orchid Emblem [Blossom] Enhancement): 시간 정지 중에도
  ''창조의 줄기'' 공격은 멈추지 않는다. (패시브 스킬)'
- '호토리 - 세상의 모든 진귀한 것 (All Treasures of the World): 종결 피해 배율이 100% 상승한다. (패시브 스킬)'
- '에스퍼 제로 (주인공) - 기본 공격 스킬 (Basic Attack Skills): 기본적인 전투 공격 능력.'
- '에스퍼 제로 (주인공) - 궁극기 (Ultimate): 강력한 필살기.'
- '에스퍼 제로 (주인공) - 서포트 스킬 (Support Skill): 아군을 지원하는 능력.'
chat_tips:
- '캐릭터가 죽을 때: "또 죽었다!" 또는 "역시 [캐릭터 이름]이야!" (긍정/부정)와 같은 반응이 나올 수 있습니다.'
- '치명적인 버그가 발생하여 게임 플레이를 방해할 때: "이게 바로 NTE의 이상 현상!"이라며 버그를 게임의 일부처럼 받아들이는 밈이 있습니다.'
- '특정 보스 ''맨홀 보스''가 등장할 때: "맨홀 보스 등장! 다들 준비해!"와 같이 긴장감을 표현하거나, "또 저 녀석이야?"와 같이 피로감을
  나타낼 수 있습니다. [cite: 20 in first tool output]'
- '보스가 예상치 못한 곳으로 사라지거나 풀피로 돌아올 때: "어디 갔어?", "체력 왜 다시 찼어?" 등의 황당하다는 반응이 나옵니다.'
- '가챠에서 좋은 캐릭터나 아이템을 뽑았을 때: "미친 뽑기운!", "NTE는 혜자 게임!"과 같이 환호하며 기쁨을 공유합니다.'
- '가챠에서 망했을 때: "내 돈! (My money!)", "역시 망겜 가챠!"와 같이 좌절감을 표현합니다.'
- 'NPC 차량을 강제로 뺏거나 범죄를 저지를 때: "씹덕 GTA 맞네!", "범죄 시스템 실화냐?"라며 게임의 자유도에 대한 놀라움을 표현합니다.'
- '플레이어 캐릭터(Zero)가 민트에게 ''Coco''라고 불릴 때: "코코 드디어 나왔다!", "민트가 부르는 코코 최고"와 같이 캐릭터 간의
  상호작용에 열광합니다.'
- '게임 내에서 예상치 못한 코믹한 상황이나 글리치가 발생했을 때: "ㅋㅋㅋ (Laughing)", "이게 무슨 일이야?", "NTE 클라스!"와
  같이 즐거움을 표현합니다.'
- '"City Tycoon" 모드에서 카페 운영이나 레이싱 등 전투 외 콘텐츠를 즐길 때: "이게 본업이지", "NTE는 도시 생활 시뮬레이터"와
  같이 의외의 재미에 집중합니다.'
- '스토리 라인이 너무 장황하거나 유치하다고 느껴질 때: "스킵 마렵다 (Want to skip)", "스토리 왜 이렇게 길어"와 같이 불평하거나
  지루함을 표현합니다.'
- '"Regalia Surprise Voucher X1"과 같이 실질적인 도움이 되지 않는 할인을 볼 때: "이게 중국식 유머인가?", "50원
