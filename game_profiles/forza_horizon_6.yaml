name: Forza Horizon 6 (포르자 호라이즌 6)
description: Playground Games가 개발하고 Xbox Game Studios가 배급하는 오픈월드 레이싱 게임입니다. 일본을 배경으로
  하며, 플레이어는 관광객으로 시작하여 Horizon Festival의 신인 드라이버가 되어 다양한 레이스와 이벤트를 통해 Horizon 레전드로
  성장해야 합니다. 550대 이상의 실제 차량과 광범위한 커스터마이징을 통해 일본의 광활하고 다채로운 오픈월드와 자동차 문화를 경험할 수 있습니다.
vision_focus:
- 지역 분위기 (도로 종류, 주변 환경 — 도시/산/해변/농지, 날씨 — 맑음/비/눈, 시간대 — 낮/밤 등)
- 플레이어 차량 상태 (차량 모델, 손상 여부, 커스터마이징 — 도색/데칼/휠/바디킷 등)
- 운행 정보 UI (속도계, RPM 게이지, 현재 기어 숫자, 니트로/부스트 충전 상태 등)
- 미니맵 및 내비게이션 UI (플레이어 위치, 목적지 표시, 추천 주행 경로, 주변 차량/이벤트 아이콘 등)
- 레이스/이벤트 진행 상황 UI (현재 순위, 남은 시간/랩 수, 체크포인트 진행률, 목표 점수 등)
- 스킬/점수 UI (현재 스킬 포인트, 콤보 배율, 획득한 최종 점수 또는 보상 등)
- 주변 차량 및 상호작용 (다른 AI/플레이어 차량의 종류와 위치, 충돌/추월 시 발생하는 시각 효과 등)
systems:
- '전투 시스템 (Combat System) 없음: Forza Horizon 6는 전통적인 HP/MP/스태미나 구조, 전투 메카닉, 특수 게이지
  등을 포함하는 전투 시스템이 없는 레이싱 게임입니다. 대신, 차량 성능, 레이싱 기술, 오픈 월드 탐험 및 커스터마이징에 중점을 둔 시스템을 갖추고
  있습니다.'
- '손목 밴드 진행 시스템 (Wristband Progression System): 플레이어가 관광객으로 시작하여 레이스, 이벤트 및 스턴트를 완료하여
  손목 밴드를 획득하고 더 좋은 차량과 상위 이벤트들을 해금합니다. 골드 손목 밴드에 도달하면 레전드 아일랜드에 접근할 수 있습니다.'
- '페스티벌 플레이리스트 시스템 (Festival Playlist System): 플레이어가 구조화된 목표를 완료하면 보상을 제공하는 순환형 시즌
  시스템입니다. 매주 새로운 챌린지와 보상 등급이 도입되며, 해금 가능한 차량, 꾸미기 아이템, 배지를 얻을 수 있습니다.'
- '차량 커스터마이징 (Car Customization): 출시 시점에 550대 이상의 차량이 제공되며, 바디 키트, 도색 및 업그레이드를 포함하여
  광범위하게 사용자 지정할 수 있습니다.'
- '오픈 월드 탐험 (Open World Exploration): 플레이어는 일본의 방대한 오픈 월드 지도를 자유롭게 탐색하며 도로, 이벤트, 숨겨진
  차량, 사이드 활동 및 경치 좋은 장소를 발견할 수 있습니다.'
- '멀티플레이어 모드 (Multiplayer Modes): 타임 어택 서킷, 드래그 미팅, 자동차 모임, 협동 LINK 스킬, 스펙 레이싱 챔피언십,
  The Eliminator 배틀 로얄 모드, 숨바꼭질 등에 원활하게 참여할 수 있습니다.'
- 'CoLab (콜랩) (구 EventLab): 멀티플레이어 지원 및 추가 옵션을 통해 사용자가 자신만의 상상력 넘치는 세계를 구현할 수 있도록
  업그레이드된 이벤트 생성 툴셋입니다.'
- '동적 날씨 시스템 (Dynamic Weather System): 계절 변화를 반영하는 동적 날씨 시스템이 게임 내 지형 전반에 걸쳐 적용됩니다.'
- '플레이어 주택 및 차고 (Player Housing & Garages): 플레이어는 잠금 해제된 차량을 최대 8개의 차고에 보관할 수 있으며,
  이 차고는 빠른 이동 지점으로도 사용됩니다. 일본 시골의 맞춤형 산악 부동산인 ''Estate''를 구입하고 꾸밀 수도 있습니다.'
- '고갯길 배틀 (Touge Battles): 유명한 일본 산악 도로에서 펼쳐지는 1대1 레이싱 이벤트입니다.'
- '타임 어택 서킷 (Time Attack Circuits): 플레이어가 특정 구간에서 최고 기록을 세우기 위해 경쟁하는 이벤트로, 친구들의 기록이
  인게임 전광판에 표시됩니다.'
- '쇼케이스 이벤트 (Showcase Events): 대규모 메카 로봇과의 레이스와 같이 독특하고 스크립트화된 특별 이벤트입니다.'
- '오토 드라이브 (Auto Drive): 목적지를 설정하면 차량이 스스로 운전하여 플레이어가 풍경을 즐길 수 있는 새로운 메커니즘입니다.'
- '정통 스토리라인 (Authentic Storylines): 일본의 전설적인 자동차 문화에 뿌리를 둔 진정한 스토리를 경험하고, Horizon
  Festival의 전설들을 만나고, 고갯길 배틀에 참여할 수 있습니다.'
- '호라이즌 러시 (Horizon Rush): 쇼케이스 이벤트와 유사하지만 스크립트화되지 않은 새로운 레이싱 이벤트 유형입니다.'
locations:
- '도쿄 시티 (Tokyo City): 게임 세계의 주요 도시이자 프랜차이즈에서 가장 크고 복잡하며 정교한 운전 공간으로, 다른 호라이즌 도시보다
  5배 더 큽니다. 네온 불빛이 가득한 거리를 특징으로 합니다.'
- '일본 시골 (Rural Japan): 사용자 지정 가능한 ''Estate''를 포함한 산악 부동산이 있는 시골 지역입니다.'
- '하코네 (Hakone): 고갯길 배틀이 펼쳐지는 유명한 일본 산악 도로 중 하나입니다.'
- '하루나 산 (Mount Haruna): 고갯길 배틀이 펼쳐지는 유명한 일본 산악 도로 중 하나입니다.'
- '반다이 아즈마 (Bandai Azuma): 고갯길 배틀이 펼쳐지는 유명한 일본 산악 도로 중 하나입니다.'
- '노리쿠라 스카이라인 (Norikura Skyline): 고갯길 배틀이 펼쳐지는 유명한 일본 산악 도로 중 하나입니다.'
- '아라시야마 타카오 파크웨이 (Arahiyama Takao Parkway): 고갯길 배틀이 펼쳐지는 유명한 일본 산악 도로 중 하나입니다.'
- '레전드 아일랜드 (Legend Island): 골드 손목 밴드를 획득한 플레이어만 접근할 수 있는 특별한 지역으로, 독특한 챌린지와 독점 레이스를
  제공합니다.'
- '도쿄 시티의 항구 및 공업 지구 (Docks and Industrial Districts of Tokyo City): 도쿄 시티 내에서 도전적인
  드라이빙을 즐길 수 있는 지역입니다.'
- '일본 전원 지역 (Countryside): 논이 펼쳐지고 벚꽃이 흩날리는 다채로운 풍경을 자랑하는 지역입니다.'
- '산악 지역 (Mountains): 안개 낀 외로운 계곡을 가로지르는 구불구불한 도로가 있는 고립되고 차가운 느낌의 지역입니다.'
- '교외 지역 (Suburbs): 도쿄 시티 주변의 교외 지역으로, 다양한 탐험 기회를 제공합니다.'
enemies:
- '레이싱 라이벌 (Racing Rivals): 호라이즌 페스티벌에서 경쟁하는 다른 드라이버들입니다.'
- '쇼케이스 이벤트 (Showcase Events): 특별한 차량이나 상황에서 펼쳐지는 독특하고 어려운 레이스 도전입니다.'
- '라이벌전 (Rivals Mode): 다른 플레이어의 고스트 차량과 기록으로 경쟁하는 모드입니다.'
- '엘리미네이터 (The Eliminator): 차량 배틀 로얄 방식의 멀티플레이어 모드에서 최후의 1인이 되기 위한 경쟁입니다.'
- 'PR 스턴트 (PR Stunts): 속도 함정, 점프대, 드리프트 존 등 특정 목표를 달성하는 도전 과제입니다.'
- '시간 어택 (Time Attack Circuits): 특정 서킷에서 가장 빠른 랩 타임을 기록하는 도전입니다.'
- '드래그 미트 (Drag Meets): 짧은 직선 구간에서 최고 속도를 겨루는 경쟁입니다.'
- '스토리 미션 (Story Missions): 일본의 자동차 문화와 관련된 서사적 도전 과제입니다.'
- '지형 및 환경 (Terrain & Environment): 눈, 비, 진흙 등 다양한 기상 조건과 험준한 지형을 극복하는 도전입니다.'
- '고스트 차량 (Ghost Cars): 다른 플레이어나 AI가 기록한 최고 기록을 보여주는 가상의 경쟁자입니다.'
skills:
- '슬립스트림 (Slippery Target): 드래프팅을 통해 스킬 점수를 높입니다.'
- '추월 (Go for the Tap): 차량 추월을 통해 스킬 점수를 높입니다.'
- '속도 (Lead Foot): 고속 주행을 통해 스킬 점수를 높입니다.'
- '공중 (Hang Time): 점프 및 공중 체류 시간을 통해 스킬 점수를 높입니다.'
- '괜찮아 (This is Fine): 주변 오브젝트 파괴를 통해 스킬 점수를 높입니다.'
- '끊김 없는 파괴 (Unbreakable): 연속적인 오브젝트 파괴를 통해 스킬 점수를 높입니다.'
- '드리프트 킹 (Dori-Kin): 전자 드리프트 액션을 통해 스킬 점수를 높입니다.'
- '괜찮아, 긁힌 것쯤이야 (Just a Scratch): 드리프트 중 가볍게 벽이나 오브젝트를 탭하여 스킬 점수를 높입니다.'
- '무슨 일 있겠어? (What Could Go Wrong): 다른 차량과의 아슬아슬한 근접 통과를 통해 스킬 점수를 높입니다.'
- '자유 영혼 (Free Spirit): 오픈 월드 자유 주행을 통해 스킬 점수를 높입니다.'
- '즐거움의 시작 (Where the Fun Begins): 스킬 배율을 2.5배 증가시킵니다.'
- '깔끔한 주행 (Squeaky Clean): 추가 스킬 점수를 10% 증가시킵니다.'
chat_tips:
- 플레이어가 새로운 일본 맵에 진입하거나 페스티벌이 시작될 때 시청자들은 "드디어 일본이다!", "환영합니다, 호라이즌 재팬!"과 같은 반응을 보입니다.
- 레이스 중 멋진 드리프트나 아슬아슬한 플레이가 나올 때 "지렸다!", "미쳤다!", "고인물 ㄷㄷ" 등의 감탄사가 나옵니다.
- 접전 끝에 승리하거나 어려운 챌린지를 성공했을 때 "GG", "개꿀잼 ㅋㅋㅋ"와 같은 만족감을 표현합니다.
- 차량이 크게 파손되거나 레이스에서 리타이어할 경우 "F", "또 박았다", "어휴 ㅉㅉ"와 같이 아쉬움이나 좌절감을 드러냅니다.
- 게임 내 벚꽃이 부서지지 않도록 설정된 것에 대해 "불멸의 벚꽃", "문화 존중 ㄷㄷ", "이건 못 부수네" 등 독특한 게임 디자인에 대한 반응이
  있습니다.
- 도쿄 시내에서의 다이내믹한 드라이빙 하이라이트 장면에서 "도쿄 드리프트 간다!", "여기가 진짜 도심인가" 등의 몰입감을 보여줍니다.
- 초기 맵 크기나 밀도에 대한 커뮤니티의 논의가 있을 때 "맵이 좀 작나?", "그래도 디테일 좋네"와 같은 찬반 의견이 오갑니다.
- 새로운 JDM(일본 내수 시장) 차량이나 유명한 클래식 카가 공개될 때 "와 신차다!", "이 차는 못 참지"라며 기대감을 표출합니다.
- 다이코쿠(Daikoku) 스타일의 카밋(Car Meet) 공간에서 다른 플레이어의 멋진 차량을 보며 "차 개쩐다", "튜닝 미쳤다", "오 이
  디자인 뭐지?" 등의 반응을 보입니다.
- 게임 초기에 발생하는 버그나 글리치를 발견했을 때 "버그 존나 많네", "초기라 어쩔 수 없지 ㅋㅋㅋ", "이것도 밈 되나?" 등의 반응을 보입니다.
- PC 버전의 실행 문제나 최적화 관련 불만이 나올 경우 "스팀판 또 버그냐", "컴터 갈아야겠네 ㅠㅠ"와 같이 답답함을 토로합니다.
- 휠(핸들) 컨트롤러의 수동 키 맵핑 등 설정 문제에 대해 "휠 설정 왜 이래", "파나텍 유저 울어요" 등 불편함을 호소합니다.
- 레이 트레이싱 그래픽 효과의 체감 여부에 대해 "레이트레이싱 차이 없는데?", "걍 끄고 한다"와 같은 의견을 나눕니다.
- Forza Horizon 시리즈 팬들은 서로를 "포붕이"라는 애칭으로 부르며 "포붕이들 환영", "포붕아 어서와" 등으로 인사합니다.
- 전작에서 이어져 온 차량 개조 밈인 'Forza Aero'에 대해 "포르자 에어로 ㅋㅋㅋㅋ", "이건 과학이지"와 같은 유머러스한 반응을 보입니다.
- 게임 내에서 후지산과 같은 일본의 상징적인 랜드마크를 발견할 때 "후지산 등반간다!", "후지산 게이 어서오고"와 같이 언급합니다.
