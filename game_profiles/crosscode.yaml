name: CrossCode (크로스코드)
description: Radical Fish Games에서 개발한 16비트 스타일의 2D 액션 RPG로, 기억과 목소리를 잃은 주인공 '레아'가
  가상 현실 MMO 게임인 'CrossWorlds'의 진실을 파헤치는 여정을 다룹니다. 빠른 템포의 화려한 전투 액션과 젤다의 전설 시리즈를 연상시키는
  정교하고 난이도 높은 퍼즐 요소가 완벽하게 조화를 이룬 것이 특징입니다.
systems:
- '실시간 8방향 전투 시스템: 근접 공격(칼)과 원거리 공격(구체 투척)을 자유롭게 전환'
- '속성 시스템: 무색, 화염, 냉기, 전격, 파동의 4가지 속성을 상황에 맞춰 실시간으로 변경'
- '회로(Circuit): 스킬 포인트를 투자해 스탯과 액티브/패시브 스킬을 해금하는 성장 트리'
- '컴뱃 아트(Combat Arts): SP를 소모하여 사용하는 단계별 필살기 (근접, 원거리, 대시, 방어형)'
- '브레이크 시스템: 적의 약점 속성이나 특정 패턴을 공략해 무력화 상태로 만드는 기믹'
- '환경 퍼즐: 맵의 고저차와 탄성, 속성 기믹을 활용한 정밀한 투척 퍼즐'
locations:
- '초보자 항구 (Rookie Harbor): 게임의 시작점이자 CrossWorlds의 메인 허브 도시'
- '베르겐 트레일 (Bergen Trail): 눈 덮인 산악 지형으로 냉기 속성 퍼즐이 시작되는 곳'
- '파즈로 템플 (Faj''ro Temple): 화염 속성을 테마로 한 거대 던전'
- '가이아의 정원 (Gaia''s Garden): 복잡한 수직 지형과 수풀이 우거진 정글 지역'
- '버밀리언 웨이스트랜드 (Vermillion Wasteland): 이야기의 큰 전환점이 발생하는 미지의 붉은 사막'
enemies:
- '고슴됴치 (Hedgehag): 게임 전반에 등장하는 가장 기초적이고 상징적인 몬스터'
- '아폴로 (Apollo): 플레이어에게 결투를 신청하는 라이벌 캐릭터이자 강력한 스피어맨 보스'
- '고대 수호자 (Ancient Guardian): 튜토리얼의 끝을 장식하는 거대 석상 보스'
- '시즈몬트 (Shizuka): 주인공의 과거와 밀접한 연관이 있는 미스테리한 적이자 보스'
- '가스트로폴리스 (Gastropoli): 달팽이 형태의 거대 메카닉 보스'
skills:
- '스피어 슬래시 (Sphere Slash): 기본 근접 콤보 스킬'
- '가드 스피어 (Guard Sphere): 전방위 방어막을 생성해 대미지를 흡수하는 방어 기술'
- '파이로 댄스 (Pyro Dance): 화염 속성으로 회전하며 주변을 타격하는 근접 기술'
- '빙하의 파편 (Glacial Shards): 냉기 속성을 활용한 강력한 광역 얼음 공격'
- '에테르 스나이프 (Ethereal Snipe): 원거리 구체 투척을 극대화한 정밀 사격 기술'
chat_tips:
- '레아의 한정된 대사: 주인공 레아는 설정상 목소리를 잃어 ''Hi!'', ''Lea!'', ''Why?'' 등 몇 가지 단어로만 소통하며, 이
  단어가 늘어날 때마다 시청자들이 함께 축하해주는 문화가 있음'
- '아폴로의 정의 선언: 라이벌 아폴로가 등장해 장황한 연설을 시작하면 채팅창에 ''또 시작됐네'' 혹은 ''Justice!'' 등의 반응이 주를
  이룸'
- '퍼즐 고통: 퍼즐 난이도가 상당히 높아 스트리머가 고전할 때 ''뇌절'' 혹은 ''지능 테스트'' 밈이 자주 등장함'
- '감정 표현 (Emotes): 레아의 초상화 감정 표현이 매우 다양하고 귀여워 하이라이트 순간마다 표정에 반응하는 시청자가 많음'
- '결투 승리: 아폴로와의 PvP 결투에서 단 한 번도 패배하지 않고 전승하는 것이 숙련자의 상징으로 통함'
