name: CrossCode (크로스코드)
description: Radical Fish Games가 만든 16비트 SNES풍 2D 액션 RPG(2018). 기억을 잃고 말도 못 하게 된 소녀 '레아'가 가상현실 MMO '크로스월드'에 접속해 행성 샤둔의 고대 사원을 따라가는 '트랙 워커 작전'에 참여하며 자신의 정체를 찾는 이야기. 빠른 탑뷰 전투(근접·구체 투척·대시·가드)와 4속성 전환, 퍼즐이 가득한 던전이 특징이며 '퍼즐로 시작해 퍼즐로 끝난다'는 평을 듣는다. 레아는 처음엔 '안녕'만 말할 수 있고, 세르게이가 단어를 하나씩 추가해 준다. 본편 10장 + DLC 'A New Home'(11~13장, 홈스테드).
vision_focus:
- 지역 분위기 (설원=베르겐, 사막=마룬 밸리, 정글=가이아의 정원, 붉은 황무지=주홍의 황무지)
- 현재 속성 모드 (좌상단 다이아몬드 아이콘 — 무색/열기/냉기/전기/파동)
- '가을 지역 구분 — 둘 다 단풍 타일: 밝은 초원·숲 위주면 가을의 부상, 연못·고대 유적·석상·점프대·지하 동굴이 보이면 가을의 몰락 (지명 UI가 있으면 그것을 따름)'
- 주변 적의 종류와 수, 보스 HP 바 유무
- 전투 랭크 표시 (우상단 Rank C/B/A/S) — 연속 전투 흐름
- 퍼즐 장치 (스위치·블록·레이저 다리·튕기는 구체 반사 패널)
- NPC·대화창·말풍선 유무와 동료(에밀리·시트론 등) 동행 여부
systems:
- '근접 공격 / 구체 던지기: 가까이선 연속 베기, 멀리선 구체를 던지고 오래 조준하면 튕기는 강공'
- '대시와 가드: 대시로 회피, 타이밍 맞춘 가드는 완벽 방어(Perfect Guard)로 피해 무효'
- '속성 모드: 열기·냉기·전기·파동 4속성을 실시간 전환 (화상·동상·감전·표적 상태이상)'
- '속성 과부하 (Element Overload): 속성 공격을 몰아 쓰면 게이지가 차서 잠시 속성을 못 씀'
- '전투 기술 (Combat Arts): SP를 써서 쓰는 필살기 — 근접·투척·대시·가드 4종, 레벨 1~3'
- 'SP: 공격으로 차는 기술 게이지'
- '회로 (Circuit): 레벨업마다 받는 회로 포인트로 속성별 트리를 열어 능력치와 전투 기술 해금'
- '전투 랭크: 쉬지 않고 싸우면 C→B→A→S로 올라 아이템 드롭이 늘어남'
- '레벨 차 경험치: 자기보다 한참 약한 적은 경험치가 거의 안 나옴(1씩)'
- '원술사 (Spheromancer): 레아의 클래스 — 구체를 다루는 원거리·근접 겸용'
- '랜드마크: 지역의 순간이동 지점, 발견하면 빠른 이동 가능'
- '퀘스트 허브: 마을마다 있는 의뢰 게시판'
- '트레이더: 몬스터 재료를 모아 장비로 교환하는 상인'
locations:
- 'M.S. 솔라 (M.S. Solar): 레아가 처음 깨어나는 화물선 — 튜토리얼과 거대 게 전투'
- '마름모 광장 (Rhombus Square): 신규 플레이어가 도착하는 도시 허브'
- '마름모 던전 (Rhombus Dungeon): 신규 플레이어 마지막 시험 던전'
- '초보자 항구 (Rookie Harbor): 본토 첫 마을, 상점·퀘스트 허브'
- '가을의 부상 (Autumn''s Rise): 가을색의 밝고 우거진 숲·초원, 첫 필드 — 고슴됴치 서식지'
- '베르겐 산길 (Bergen Trail): 눈 덮인 산길, 아폴로와 결투'
- '베르겐 마을 (Bergen Village): 설원 마을'
- '사원 광산 (Temple Mine): 첫 속성 던전(냉기), 얼음 바닥 퍼즐'
- '마룬 밸리 (Maroon Valley): 사막·오아시스 필드'
- '바키 쿰 (Ba''kii Kum): 사막 마을'
- '파즈로 사원 (Faj''ro Temple): 열기 던전'
- '주홍의 황무지 (Vermillion Wasteland): 미공개 구역, 고립 챕터의 무대'
- '가을의 몰락 (Autumn''s Fall): 가을의 부상의 형제 지역 — 연못·고대 유적·점프대가 많고 지하 동굴로 파라 섬 레이드에 이어짐, 가장 넓고 적이 많은 필드'
- '가이아의 정원 (Gaia''s Garden): 정글 필드'
- '유역의 아성 (Basin Keep): 정글 도시 허브'
- '지르비타르 사원 (Zir''vitar Temple): 전기 던전'
- '소나지즈 사원 (So''najiz Temple): 파동 던전'
- '사파이어 산맥 (Sapphire Ridge): 대나무·판다 지역'
- '그랜드 크리스카조 (Grand Krys''kajo): 거대 나무 던전'
- '주홍의 탑 (Vermillion Tower): 본편 최종 던전'
- '홈스테드 (Homestedt): DLC 지역, 레아의 집'
- '하늘빛 군도 (Azure Archipelago): DLC 바다 지역'
- '쿨레로 사원 (Ku''lero Temple): DLC 마지막 던전'
enemies:
- '고슴됴치 (Hedgehag): 가을의 부상 대표 몬스터, 공식 번역부터 말장난'
- '힐캣 (Hillkat): 헤드뱅잉하는 미어캣, 록커 힐캣·불꽃 힐캣'
- '화난 들소 (Mad Bovine): 돌진하는 소'
- '프로빗 (Frobbit): 베르겐 산길의 토끼형 몬스터'
- '펭펭 (Pengpeng) / 카로토 (Karotto): 설원의 펭귄·마법 눈사람'
- '핀저론 (Pinceron) / 샤크스터 (Sharkster): 마룬 밸리의 전갈·모래 속 물고기'
- '판짜 (Pandza): 사파이어 산맥의 게으른 호버 판다'
- '거대 게 (Huge Hostile Crab): M.S. 솔라의 첫 보스'
- '마름모 중포탑 2.0 (Rhombus Heavy Turret 2.0): 마름모 던전 보스'
- '파란색 고슴됴치 (Blue Hedgehag) / 힐캣 밴드리더 (Hillkat Bandleader): 가을의 부상 보스'
- '아폴로 (Apollo): ''정의의 사도''를 자칭하는 원술사 라이벌, 여러 번 결투'
- '펭귄의 왕 다카라 (Peng King Dakara): 베르겐 산길 보스'
- '감염된 디그모 (Infected Digmo) / 용광로 디그모 (Smelter Digmo): 사원 광산 보스'
- '핀조람 (Pinzo''jrahrrrn) / 마스터 매그모스 (Master Magmoth): 파즈로 사원 보스'
- '플라즈마 팬텀 (Plasma Phantom): 지르비타르 사원 보스'
- '블로버스 스타르니쿠스 경 (Sir Blobus Starnikus): 소나지즈 사원 보스'
- '세피슬로스 (Sephisloth): 가이아의 정원 보스'
- '고대 수호자 (Ancient Guardian) / 동쪽의 아들 (Son of the East): 그랜드 크리스카조 보스'
- '고슴됴치 왕 (The Hedgelord): 날아다니는 고슴됴치의 왕'
- '마지막 포탑 IX (Final Turret IX) / 창조자 (The Creator): 주홍의 탑 보스'
- '디오르비스 (Di''orbis): DLC 쿨레로 사원의 고대 신'
skills:
- '가드 스피어 (Guard Sphere): 무색 가드 기술, 방어막'
- '하늘색 타격 (Azure Strike): 무색 대시 기술'
- '스피어 소우 (Sphere Saw) / 빗발치는 총알 (Bullet Rain): 무색 근접·투척 기술'
- '화상! (Burn!) / 불타는 용 (Blazing Dragon): 열기 투척·근접 기술'
- '라그나로크 (Ragnarök): 열기 레벨 3 근접 기술'
- '얼어붙은 별 (Frozen Star) / 얼음 장벽 (Brisk Barrier): 냉기 근접·가드 기술'
- '영원한 겨울 (Eternal Winter) / 개틀링 포격 (Gatling Arctillery): 냉기 레벨 3 기술'
- '테슬라 트위스트 (Tesla Twist) / 연쇄 공격 (Chain Blitz): 전기 근접·투척 기술'
- '묠니르 (Mjölnir) / 폭풍의 노래 (Song of Storms): 전기 레벨 3 기술'
- '기 공격 (Ki Thrust) / 워프 미끼 (Warp Decoy): 파동 근접·대시 기술'
- '에테르 스나이프 (Ether Snipe) / 파동 모션 빔 (Wave Motion Beam): 파동 레벨 3 투척 기술'
- '궁니르 (Gungnir): 파동 레벨 3 대시 기술'
chat_tips:
- 레아는 말 대신 '안녕'만 할 수 있었고, 세르게이가 '레아', '잘 가', '잠깐', '뭐/어디/누구' 같은 단어를 하나씩 추가해 줌 — 새 단어를 배우면 채팅이 축하
- 말은 못 해도 표정과 끄덕임으로 다 전하는 레아 — '표정 연기 장인', '말 안 해도 다 알겠다'
- 아폴로가 '정의'를 외치며 극적으로 등장하면 '또 왔다', '정의 타령' 반응, 결투가 시작되면 응원
- 고슴됴치는 공식 번역부터 말장난 — 고슴됴치를 보면 '됴치다', '귀여운데 아픔'
- 퍼즐 던전 — '퍼즐로 시작해 퍼즐로 끝나는 게임', 오래 막히면 '지능 테스트', '뇌정지' 채팅
- 얼음 바닥 미끄럼 퍼즐(사원 광산)이나 튕기는 구체 반사 퍼즐에서 각도를 잘못 재면 '각도 다시', '한 칸만 더'
- 전투 랭크가 S까지 오르면 '랭크 유지 가즈아', 끊기면 '아 랭크…'
- 과레벨로 잡몹을 잡으면 경험치가 1씩만 나옴 — '경험치 1 실화냐', '다음 지역 가자'
- 보스 HP 바가 뜨면 '보스전이다', 패턴을 완벽 방어로 받아내면 '완벽 방어 장인', '타이밍 미쳤다'
- 에밀리(경쟁심 강한 빨간 머리 신규 플레이어)·시트론·슈나이더 같은 동료와 파티를 짜면 반가워함
- 숨은 아이템 '닥 페퍼'(Dk Pepper)를 찾으면 패러디 반응
- '''기가 나선 드릴''·''은하 나선 드릴'' 장비가 나오면 드릴 애니 패러디 반응'
- '''할리데이 맨''(Holiday Man) 이벤트 NPC를 만나면 반가워함'
- 보너스 코드로 레아가 캐러멜단스 춤을 추는 패러디가 있음 — '우마우마'
- 16비트 도트 그래픽과 음악 칭찬 — '도트 장인', 'BGM 좋다'
- 줄거리 핵심(레아의 정체, 엔딩)은 스포일러 — 채팅은 '스포 금지' 분위기를 지킨다
