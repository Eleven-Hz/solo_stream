vision_focus:
- 지역 분위기 (배경 색상·지형 — 설원/사막/정글/항구/던전 등)
- 현재 속성 모드 (화면 속성 아이콘 — 무색/열기/냉기/전기/파동)
- HP·SP 게이지 상태 (여유/위기 등)
- 주변 몬스터 종류와 수
- NPC 또는 대화창 유무
name: CrossCode (크로스코드)
description: Radical Fish Games가 개발한 2D 액션 RPG로, 먼 미래를 배경으로 합니다. 기억을 잃고 말을 할 수 없게
  된 주인공 '레아'가 가상현실 MMORPG 'CrossWorlds'에 접속하여 자신의 기억을 되찾고 CrossWorlds를 둘러싼 미스터리를 파헤치는
  이야기를 그립니다. 16비트 SNES 스타일 그래픽, 부드러운 물리 엔진, 빠르게 진행되는 전투 시스템, 몰입감 있는 퍼즐 메커니즘을 특징으로
  하며, 고전 게임의 향수를 불러일으키는 도트 그래픽과 수준 높은 퍼즐의 조화로 호평받고 있습니다.
systems:
- 'Balls (원거리 공격): 원거리에서 적을 공격하기 위해 구슬을 던지는 기본 전투 액션.'
- 'Melee (근접 공격): 가까이 있는 적을 공격하기 위한 근접 전투 액션.'
- 'Dashing (대시/회피): 공격을 피하거나 빠르게 이동하기 위한 액션으로, 짧은 무적 시간을 제공하지만 연속 사용 시 스태미나 고갈로 일시적인
  이동 불능 상태가 될 수 있습니다.'
- 'Guarding (가드/방어): 적의 공격을 막는 액션이며, 타이밍을 맞춰 사용하면 Perfect Guard (완벽 방어)가 되어 피해를 완전히
  막고 적을 ''격파'' 상태로 만듭니다.'
- 'Elemental Modes (속성 모드): Heat (열기), Cold (냉기), Shock (전기), Wave (파동)의 네 가지 속성을
  실시간으로 전환하며, 각 속성마다 스탯 보너스, 저항력, 고유한 공격 및 Circuit (회로 성장 트리)의 Combat Arts (전투 아츠)에
  접근할 수 있습니다.'
- 'Combat Arts (전투 아츠): Circuit (회로 성장 트리)를 통해 해금되는 특수 기술로, Special Points (SP)를 소모하여
  사용합니다. 원거리, 근접, 대시, 방어 등 다양한 유형이 있습니다.'
- 'Circuit (회로 성장 트리): 파이널 판타지 X의 스피어 그리드와 유사한 성장 시스템으로, Circuit Points (CP)를 사용하여
  스탯 상승을 위한 Passive Circuits (패시브 회로)와 Combat Arts (전투 아츠)를 해금합니다. 중립 트리가 존재하며 각 속성별로
  별도의 트리가 있습니다.'
- 'Circuit Points (CP): 레벨업마다 각 Circuit (회로 성장 트리)에 할당되는 포인트로, 스킬을 해금하는 데 사용됩니다.'
- 'Special Points (SP): Combat Arts (전투 아츠) 사용에 필요한 자원으로, 적을 공격하여 충전됩니다.'
- 'HP (체력): 플레이어의 생명력. 대량의 적 처치, 보스전 특정 HP 감소 구간, 또는 자연 재생을 통해 회복됩니다.'
- 'Stamina (스태미나): 대시 및 일부 행동에 사용되는 암묵적인 자원으로, 과도한 대시 사용 시 이동 불능 상태가 됩니다.'
- 'Perfect Guard (완벽 방어): 공격 타이밍에 맞춰 가드 성공 시 발동하며, 피해와 경직을 무효화하고 적을 ''Break (격파)''
  상태로 만듭니다.'
- 'Break (격파): 완벽 방어 또는 특정 공격으로 적에게 유발되는 취약 상태로, 이 상태의 적은 더 큰 피해를 받고 행동 불능이 됩니다.'
- 'Combat Rank (전투 랭크): 전투를 지속적으로 유지하면 상승하며, 적 드롭률이 증가합니다 (C: +10%, B: +25%, A: +50%,
  S: +100%). S 랭크 시에는 음악이 변경되고 적 리스폰 속도가 빨라집니다.'
- 'Experience Points (EXP, 경험치): 적 처치 및 퀘스트 완료를 통해 얻으며, 레벨업을 통해 캐릭터의 전투 능력을 향상시킵니다.'
- 'Leveling System (레벨업 시스템): 매 레벨업마다 고정된 1000 EXP를 요구하지만, 플레이어와 적/퀘스트 레벨 차이에 따라 얻는
  경험치 양이 크게 달라집니다.'
- 'Elements Overload (속성 과부하): 속성 능력을 과도하게 사용하면 게이지가 차오르며, 가득 찰 경우 게이지가 소진될 때까지 속성
  능력을 사용할 수 없습니다. 중립 공격으로 게이지 소진을 가속할 수 있습니다.'
- 'Modifier (모디파이어): 장비에 부여되는 특수 능력치로, 치명타 피해 증가, 방어 중 받는 피해 감소, 기절한 적에게 주는 피해 증가
  등 다양한 효과를 제공합니다. 일부는 적의 공격력을 높이거나 선제 공격을 유발하기도 합니다.'
locations:
- 'Rookie Harbor (루키 하버): 게임 초반에 해금되는 첫 번째 항구 도시로, 상점과 퀘스트 허브 역할을 합니다.'
- 'Autumn''s Rise (가을의 부상): Rookie Harbor (루키 하버) 이후 해금되는 첫 번째 대규모 탐험 지역으로, 가을 테마의
  숲과 초원 지역입니다.'
- 'Rhombus Dungeon (마름모 던전): 게임의 초반에 진입하는 튜토리얼 성격의 던전입니다.'
- 'Bergen Trail (베르겐 산길): Autumn''s Rise (가을의 부상)와 Bergen Village (베르겐 마을)를 잇는 탐험
  지역으로, 레이저 다리 등의 퍼즐 요소가 있습니다.'
- 'Bergen Village (베르겐 마을): Bergen Trail (베르겐 산길)을 지나 해금되는 설원 테마의 마을입니다.'
- 'Temple Mine (사원 광산): 게임 초반에 해금되는 첫 번째 속성 던전 (냉기)으로, 냉기 속성 능력을 획득할 수 있으며, 길고 도전적인
  퍼즐이 특징입니다.'
- 'Autumn''s Fall (가을의 낙엽): Autumn''s Rise (가을의 부상) 이후 해금되는 넓은 탐험 지역으로, 폐허와 수원이 특징이며
  Gaia''s Garden (가이아의 정원)으로 이어집니다.'
- 'Maroon Valley (마룬 계곡): Bergen Village (베르겐 마을) 이후 해금되는 사막 테마의 탐험 지역으로, 사막, 오아시스,
  황무지 기후가 공존하며 복잡한 필드 퍼즐이 많습니다.'
- 'Ba''kii Kum (바키 쿰): Maroon Valley (마룬 계곡)를 통해 진입할 수 있는 사막 지역의 주요 거점 도시입니다.'
- 'Faj''ro Temple (파즈로 사원): 열기 속성 능력을 획득하는 던전으로, 적절한 크기와 관리하기 쉬운 퍼즐, 잘 연결된 구역들로 호평받습니다.'
- 'Gaia''s Garden (가이아의 정원): 정글 테마의 후반 탐험 지역으로, Sapphire Ridge (사파이어 산등성이)로 이어집니다.'
- 'Basin Keep (분지 요새): Gaia''s Garden (가이아의 정원) 지역의 허브 역할을 하는 도시로, 인상적인 분위기와 타워 디펜스
  퀘스트로 알려져 있습니다.'
- 'Zir''vitar Temple (지르비타 사원): 전기 속성 능력을 획득하는 던전으로, Basin Keep (분지 요새)의 특정 퀘스트를 완료해야
  해금됩니다.'
- 'So''najiz Temple (소나지즈 사원): 파동 속성 능력을 획득하는 던전으로, Zir''vitar Temple (지르비타 사원)과 마찬가지로
  Basin Keep (분지 요새)의 특정 퀘스트를 통해 해금됩니다.'
- 'Grand Krys''kajo (그랜드 크리스카조): 충격과 파동 속성을 모두 활용하는 복합적인 던전으로, 난이도 높은 퍼즐과 보스전으로 호평받는
  주요 던전 중 하나입니다.'
- 'Vermillion Wasteland (주홍빛 황무지): 게임 후반부에 해금되는 황무지 테마의 탐험 지역으로, 최종 던전인 Vermillion
  Tower (주홍빛 탑)로 이어집니다.'
- 'Vermillion Tower (주홍빛 탑): 게임의 최종 던전입니다.'
enemies:
- '고슴도치 (Hedgehag): Autumn''s Rise에서 발견되는 일반 유기체 몬스터.'
- '매드 보바인 (Mad Bovine): Autumn''s Rise에서 발견되는 광포한 소형 일반 몬스터.'
- '감염된 디그모 (Infected Digmo): 사원 광산의 중간 보스로, 플리저에 감염되어 있다.'
- '거대한 적대적 게 (Huge Hostile Crab): CrossCode의 첫 번째 필수 메인 보스로, 약점은 등 뒤의 수정이다.'
- '마름모 중포탑 2.0 (Rhombus Heavy Turret 2.0): CrossWorlds의 튜토리얼 메인 보스로, 방어막을 파괴해야 공격할
  수 있다.'
- '아폴로 (Apollo): 자신을 치터로 모는 메인 보스로, 완벽한 방어와 카운터가 중요하다.'
- '서 블로버스 스타르니쿠스 (Sir Blobus Starnikus): So''najiz Temple의 메인 보스.'
- '세피슬로스 (Sephisloth): Gaia''s Garden의 메인 보스.'
- '핀조람 (Pinzo''jrahrrrn): 개미귀신의 변종으로 불리는 메인 보스로, 유사 지형을 만들고 집게로 공격한다.'
- '최종 포탑 IX (Final Turret IX): 최종 보스 중 하나로, 4가지 속성 버전이 존재한다.'
- '킹 칵토로 (King Kaktorro): DLC에 등장하는 보스.'
skills:
- '가드 스피어 (Guard Sphere): 몇 초간 받는 대미지를 감소하는 방어막을 생성하고 경직을 없애 안전하게 스킬을 사용할 수 있게 한다.'
- '아즈르 스트라이크 대시 (Azure Strike Dash): 긴 이동 거리를 가지며, 시전 중 무적 판정을 받아 이동 및 회피에 유용하다.'
- '화상! (Burn!): 열기 속성 원거리 기술로, 적에게 화상 피해를 입히고 보스 격파에 효과적이다.'
- '불타는 용 (Blazing Dragon): 열기 속성 근접 스킬로 강력한 단일 대상 대미지를 입힌다.'
- '스웜 원거리 공격 (Swarm Ranged Attack): 전기 속성 원거리 기술로 보스에게 큰 대미지를 주고 격파할 수 있다.'
- '묠니르 (Mjolnir): 전기 속성 스킬로 넓은 범위의 적 무리를 쉽게 처리할 수 있다.'
- '디코이 대시 (Decoy Dash): 파동 속성 대시 기술로, 마크 디버프와 스턴을 빠르게 걸고 높은 대미지를 준다.'
- '에테르 스나이프 (Aether Snipe): 파동 속성 원거리 기술로, 게임 내에서 가장 높은 단일 대상 대미지를 주는 기술 중 하나이다.'
- '공격력 증가 (Attack Increase): 플레이어의 공격 대미지를 일정 비율 증가시키는 패시브 스킬.'
- '추가 대시 (Extra Dash): 플레이어가 사용할 수 있는 대시 횟수를 증가시키는 패시브 스킬.'
chat_tips:
- Lea가 "Hi!" 또는 "Bye!"만 말할 때 시청자들은 채팅창에 똑같이 "Hi!" 또는 "Bye!"를 반복하며 캐릭터의 귀여움을 표현합니다.
- 플레이어가 어려운 구간에서 연속으로 죽으면 "또 죽었다", "F" 또는 "gg"와 같은 좌절감 섞인 반응이 올라옵니다.
- 새로운 보스가 등장하거나 보스 음악이 시작될 때 시청자들은 "벌써 보스 음악이?", "왜 벌써 보스 음악이 들리지?"와 같이 기대와 긴장감을 표현합니다.
- 스트리머가 보스를 멋지게 처치하거나 "원 사이클" 공략에 성공하면 "와!", "미쳤다!", "렛츠고!" 등의 환호성 섞인 반응이 터져 나옵니다.
- 에밀리가 "레이저 다리"를 건널 때마다 과장된 반응을 보이면 시청자들은 "레이저 다리!", "에밀리 반응 봐라" 등으로 놀리거나 공감합니다.
- 에밀리가 벌레를 보고 겁을 먹는 상황이 나오면 시청자들은 "귀여워", "벌레 싫어하는 건 똑같네" 등의 반응을 보입니다.
- 루카스가 어설프게 번역된 독일어 관용구를 사용할 때 시청자들은 "번역 무엇?", "이게 무슨 뜻이지?" 등 흥미로운 반응을 보입니다.
- 특정 기간에만 등장하는 "Holiday Man"이 나타나면 "홀리데이 맨 왔다!", "원펀맨이다!" 등의 반응으로 즐거워합니다.
- 게임 내 아이템 "인피니트 스파이럴 드릴"이 언급되면 "천지를 뚫을 드릴이다!", "그렌라간이잖아!"와 같이 애니메이션 밈을 공유합니다.
- '"Dk Pepper" 아이템을 발견하면 "닥터 페퍼?", "슈타인즈 게이트?"와 같은 특정 애니메이션과의 연관성을 언급합니다.'
- '"시커 센스"로 NPC나 다른 플레이어의 닉네임을 볼 때, 밈이나 재미있는 별명에 시청자들이 "빵 터졌다"는 반응을 보입니다.'
- 보너스 코드를 통해 Lea가 카라멜단센 춤을 추는 idle 애니메이션이 활성화되면, 시청자들은 "우마우마 댄스!", "추억이다" 등의 반응을 보입니다.
- '"SPEED LINES" 보너스 코드를 사용하여 Lea의 움직임에 속도선이 추가되면, "더 빨라졌다!", "레아에게 속도감을!" 등의 유머러스한
  반응이 나옵니다.'
- 게임의 어려운 퍼즐이나 전투 난이도에 대해 스트리머가 고통받으면, 시청자들은 "역시 크로스코드", "이 게임 원래 이래요" 등 공감하거나 놀리는
  반응을 보입니다.
- 커뮤니티에서 "크로스코드 밈이 더 필요하다"는 의견이 자주 제기되며, 이는 게임에 대한 애정과 더 많은 유머 콘텐츠를 원하는 바람을 나타냅니다.
- '"There are no mistakes, just happy little accidents" 대사를 하는 Bob Ross 패러디 NPC를 발견하면,
  "밥 로스다!", "참 쉽죠?"와 같은 반응을 보입니다.'
- Lea의 제한된 어휘와 대비되는 풍부한 표정 변화에 시청자들은 "표정 연기 천재", "말은 없어도 다 알겠다"며 감탄합니다.
