name: CrossCode (크로스코드)
description: Radical Fish Games가 만든 16비트 SNES풍 2D 액션 RPG(2018). 기억과 말을 잃은 소녀 '레아'가 가상현실 MMO '크로스월드'에서 고대 사원을 따라가는 '트랙 워커 작전'에 참여하며 자신의 정체를 찾는 이야기. 빠른 탑뷰 전투와 4속성 전환, '퍼즐로 시작해 퍼즐로 끝난다'는 평의 퍼즐 던전이 특징. 본편 10장 + DLC 'A New Home'.
stt_terms: [에밀리네이터, 루크, 시즈카, 크로스월드, 최초의 학자들, 원술사, 포탑, 랜드마크, 다이렉트 링크]
vision_focus:
- 지역 분위기 (설원=베르겐, 사막=마룬 밸리, 정글=가이아의 정원, 붉은 황무지=주홍의 황무지)
- 현재 속성 모드 (좌상단 다이아몬드 아이콘 — 무색/열기/냉기/전기/파동)
- '가을 지역 구분 — 둘 다 단풍 타일: 밝은 초원·숲 위주면 가을의 부상, 연못·고대 유적·석상·점프대·지하 동굴이 보이면 가을의 몰락 (지명 UI가 있으면 그것을 따름)'
- 주변 적의 종류와 수, 보스 HP 바 유무
- 전투 랭크 표시 (우상단 Rank C/B/A/S) — 연속 전투 흐름
- 퍼즐 장치 (스위치·블록·레이저 다리·튕기는 구체 반사 패널)
- NPC·대화창·말풍선 유무와 동료(에밀리·시트론 등) 동행 여부
characters:
- '레아 (Lea): 기억과 말을 잃은 주인공, 처음엔 ''안녕''만 말함'
- '세르게이 (Sergey): 레아를 돕는 엔지니어, 단어를 하나씩 추가해 줌'
- '에밀리 (Emilie): 아바타명 에밀리네이터, 경쟁심 강한 신규 플레이어'
- '슈나이더 (Schneider): 에밀리의 친구, 장난 좋아하는 베테랑'
- '시트론 (C''tron): 최초의 학자들 길드 새내기, 과학 지식 자랑'
- '아폴로 (Apollo): 정의를 외치는 원술사 라이벌, 치터 혐오'
- '흐린 (Hlin) / 베오울프 (Beowulf): 최초의 학자들 길드 창립자'
- '의문의 아바타: M.S. 솔라에 나타난 정체불명의 아바타'
systems:
- '근접 공격 / 구체 던지기: 근접 연속 베기, 오래 조준하면 튕기는 강공'
- '대시와 가드: 타이밍 맞춘 가드는 완벽 방어(Perfect Guard)'
- '속성 모드: 열기·냉기·전기·파동 4속성 실시간 전환'
- '속성 과부하 (Element Overload): 속성을 몰아 쓰면 잠시 봉인'
- '전투 기술 (Combat Arts): SP를 쓰는 필살기, 레벨 1~3'
- '회로 (Circuit): 레벨업 포인트로 속성별 트리 해금'
- '전투 랭크: 쉬지 않고 싸우면 C→S, 드롭 증가'
- '원술사 (Spheromancer): 구체를 다루는 레아의 클래스'
- '랜드마크: 발견하면 빠른 이동 가능한 지점'
locations:
- 'M.S. 솔라 (M.S. Solar): 레아가 깨어나는 화물선, 튜토리얼'
- '마름모 광장 (Rhombus Square) / 마름모 던전 (Rhombus Dungeon): 신규 플레이어 도시와 시험 던전'
- '초보자 항구 (Rookie Harbor): 본토 첫 마을, 퀘스트 허브'
- '가을의 부상 (Autumn''s Rise): 밝은 단풍 숲·초원, 첫 필드'
- '가을의 몰락 (Autumn''s Fall): 연못·유적·점프대, 가장 넓은 필드'
- '베르겐 산길 (Bergen Trail) / 베르겐 마을 (Bergen Village): 설산 길과 마을'
- '사원 광산 (Temple Mine): 첫 던전(냉기), 얼음 미끄럼 퍼즐'
- '마룬 밸리 (Maroon Valley) / 바키 쿰 (Ba''kii Kum): 사막 필드와 마을'
- '파즈로 사원 (Faj''ro Temple): 열기 던전'
- '가이아의 정원 (Gaia''s Garden) / 유역의 아성 (Basin Keep): 정글 필드와 도시'
- '지르비타르 사원 (Zir''vitar Temple) / 소나지즈 사원 (So''najiz Temple): 전기·파동 던전'
- '사파이어 산맥 (Sapphire Ridge): 대나무·판다 지역'
- '그랜드 크리스카조 (Grand Krys''kajo): 거대 나무 던전'
- '주홍의 황무지 (Vermillion Wasteland) / 주홍의 탑 (Vermillion Tower): 후반 지역과 본편 최종 던전'
- '홈스테드 (Homestedt) / 하늘빛 군도 (Azure Archipelago) / 쿨레로 사원 (Ku''lero Temple): DLC 지역'
enemies:
- '고슴됴치 (Hedgehag): 대표 몬스터, 공식 번역부터 말장난'
- '힐캣 (Hillkat): 헤드뱅잉하는 미어캣'
- '프로빗 (Frobbit) / 펭펭 (Pengpeng): 베르겐의 토끼·펭귄형 몬스터'
- '핀저론 (Pinceron) / 샤크스터 (Sharkster): 마룬 밸리의 전갈·모래 물고기'
- '판짜 (Pandza): 사파이어 산맥의 호버 판다'
- '거대 게 (Huge Hostile Crab): M.S. 솔라의 첫 보스'
- '펭귄의 왕 다카라 (Peng King Dakara): 베르겐 산길 보스'
- '감염된 디그모 (Infected Digmo) / 용광로 디그모 (Smelter Digmo): 사원 광산 보스'
- '핀조람 (Pinzo''jrahrrrn) / 마스터 매그모스 (Master Magmoth): 파즈로 사원 보스'
- '플라즈마 팬텀 (Plasma Phantom): 지르비타르 사원 보스'
- '블로버스 스타르니쿠스 경 (Sir Blobus Starnikus): 소나지즈 사원 보스'
- '세피슬로스 (Sephisloth): 가이아의 정원 보스'
- '고슴됴치 왕 (The Hedgelord): 날아다니는 고슴됴치의 왕'
skills:
- '가드 스피어 (Guard Sphere) / 하늘색 타격 (Azure Strike): 무색 가드·대시 기술'
- '스피어 소우 (Sphere Saw) / 빗발치는 총알 (Bullet Rain): 무색 근접·투척 기술'
- '화상! (Burn!) / 불타는 용 (Blazing Dragon): 열기 투척·근접 기술'
- '라그나로크 (Ragnarök): 열기 레벨 3 근접 기술'
- '얼어붙은 별 (Frozen Star) / 얼음 장벽 (Brisk Barrier): 냉기 근접·가드 기술'
- '영원한 겨울 (Eternal Winter) / 개틀링 포격 (Gatling Arctillery): 냉기 레벨 3 기술'
- '테슬라 트위스트 (Tesla Twist) / 연쇄 공격 (Chain Blitz): 전기 근접·투척 기술'
- '묠니르 (Mjölnir) / 폭풍의 노래 (Song of Storms): 전기 레벨 3 기술'
- '기 공격 (Ki Thrust) / 워프 미끼 (Warp Decoy): 파동 근접·대시 기술'
- '에테르 스나이프 (Ether Snipe) / 궁니르 (Gungnir): 파동 레벨 3 투척·대시 기술'
chat_tips:
- 레아가 세르게이에게서 새 단어를 받을 때마다 채팅이 축하 — '레아 말 늘었다'
- 말 대신 표정·끄덕임으로 다 전하는 레아 — '표정 연기 장인'
- 아폴로가 '정의'를 외치며 극적으로 등장하면 '또 왔다', '정의 타령', 결투 시작되면 응원
- 고슴됴치는 공식 번역부터 말장난 — '됴치다', '귀여운데 아픔'
- 퍼즐에 오래 막히면 '지능 테스트', '뇌정지'
- 구체 반사·얼음 미끄럼 퍼즐에서 빗나가면 '각도 다시', '한 칸만 더'
- 전투 랭크 S면 '랭크 유지 가즈아', 끊기면 '아 랭크…'
- 과레벨로 잡몹을 잡으면 경험치가 1씩 — '경험치 1 실화냐', '다음 지역 가자'
- 보스 패턴을 완벽 방어로 받아내면 '완벽 방어 장인', '타이밍 미쳤다'
- 숨은 아이템 '닥 페퍼'(Dk Pepper)를 찾으면 패러디 반응
- 보너스 코드로 레아가 캐러멜댄스를 추는 패러디 — '우마우마'
- 줄거리 핵심(레아의 정체, 엔딩)은 스포일러 — 채팅은 '스포 금지' 분위기를 지킨다
