name: Stellaris (스텔라리스)
description: 패러독스 개발 스튜디오에서 개발하고 패러독스 인터랙티브에서 배급한 SF 4X 대전략 시뮬레이션 게임입니다. 플레이어는 항성
  간 여행을 막 시작한 문명을 이끌고 은하계를 탐험하며 새로운 행성을 식민지화하고, 다양한 외계 종족과 교류하며 제국을 확장해나갑니다. 외교, 무역,
  전쟁 등 다양한 상호작용을 통해 은하계의 운명을 결정하며, 매번 새로운 탐험과 예측 불가능한 사건들을 경험하게 됩니다.
vision_focus:
- '은하계 지도: 별 시스템, 제국 국경, 함대/성계 아이콘의 색상과 모양을 통해 탐사 범위, 세력 판도, 함대 배치를 파악.'
- '상단 자원 패널: 에너지, 광물, 식량 등 주요 자원 수치 및 변화 아이콘을 통해 제국의 경제 상태와 생산 추세를 분석.'
- '선택 개체 정보: 선택된 함선/행성/과학선 아이콘, 이름, 속성(체력, 연구 진행, 인구)을 통해 개체의 상태와 역할을 이해.'
- '행성 개발 화면: 건물 슬롯, 특수지구 유형, 인구(POP) 성장률 및 직업 분포를 통해 행성의 생산성과 개발 방향을 진단.'
- '연구 진행 패널: 현재 연구 중인 기술 아이콘, 진행률 막대, 완료된 기술 목록을 통해 기술 발전 상황과 전략적 우선순위를 확인.'
- '이벤트/알림 창: 팝업 메시지, 아이콘, 텍스트를 통해 중요한 게임 내 사건과 즉각적인 조치 필요성을 인지.'
- '외교 창: 타 제국 아이콘, 관계 상태(우호/적대), 제국 특성을 통해 잠재적 동맹 또는 위협을 식별.'
- '함대 구성/전투 화면: 아군/적 함선 유형, 수, 체력바, 무기 효과 아이콘을 통해 전력 균형과 전투 진행 상황을 예측.'
systems:
- '함선 전투 시스템 (Space Warfare System): 함대 간의 실시간 전투로, 플레이어는 긴급 FTL 명령 외에 개별 함선을 직접 제어할
  수 없으며, 함선 설계와 상성 우위가 중요합니다.'
- '피해 적용 시스템 (Damage Application System): 적의 공격은 함선의 보호막(Shields), 장갑(Armor), 선체(Hull)
  순서로 피해를 입히며, 선체가 0이 되면 함선이 파괴됩니다.'
- '무기 및 방어 상성 (Weapon and Defense Counter System): 운동 에너지 무기는 보호막에, 에너지 무기는 장갑에 강하며,
  미사일/어뢰/교란기는 보호막과 장갑을 우회하거나 관통할 수 있습니다.'
- '명중률, 추적, 회피 (Accuracy, Tracking, Evasion): 무기의 명중률과 함선의 회피율, 무기의 추적 능력에 따라 공격이
  성공할 확률이 결정되어 전투 결과에 영향을 미칩니다.'
- '이탈 시스템 (Disengagement System): 함선이 선체 내구도의 50% 이하로 피해를 입으면 전투에서 이탈할 확률이 생겨 함선 손실을
  줄일 수 있습니다.'
- '전통 시스템 (Traditions System): 통합(Unity) 자원을 소모하여 확장(Expansion), 번영(Prosperity), 우월(Supremacy)
  등 다양한 전통 트리를 채택하고 보너스를 개방하여 제국을 성장시킵니다.'
- '승천 특전 (Ascension Perks): 전통 트리를 완성하면 얻을 수 있는 강력한 제국 전체 보너스로, 콜로서스 계획(Colossus Project)이나
  초월적 진화(Synthetic Evolution) 같은 고유한 능력을 해금합니다.'
- '지도자 시스템 (Leader System): 제독(Admirals), 장군(Generals), 과학자(Scientists), 총독(Governors)
  등 지도자를 고용하고 성장시키며, 특성과 베테랑 클래스를 통해 제국 운영 및 군사력에 다양한 보너스를 제공합니다.'
- '함선 등급 및 역할 (Ship Classes and Roles): 초계함(Corvette), 구축함(Destroyer), 순양함(Cruiser),
  전함(Battleship), 타이탄(Titan), 콜로서스(Colossus) 등 다양한 함선 등급이 존재하며, 각 함급은 고유한 역할과 전투 스타일을
  가집니다.'
- '위기 시스템 (Crisis System): 게임 중반 및 후반에 발생하는 대규모 위협으로, 프레소린 스컬지(Prethoryn Scourge),
  컨틴전시(Contingency), 언비든(Unbidden)과 같은 강력한 적대 세력이 등장하여 은하 전체를 위협합니다.'
- '자원 관리 시스템 (Resource Management System): 에너지 화폐(Energy Credits), 광물(Minerals), 식량(Food),
  합금(Alloys) 등 다양한 자원을 효율적으로 관리하여 제국의 성장과 군사력 유지의 기반을 마련합니다.'
locations:
- '웬크워트 (Wenkwort): 모든 게임에서 확정적으로 생성되는 가이아 행성(Gaia World)인 웬크워트 아르템(Wenkwort Artem)을
  포함하며, 연구 중심 제국에 유용합니다. (초반 해금, 특별한 조건 없이 발견)'
- '솔 (Sol): 인류의 고향인 지구를 포함하는 성계로, 탐험 시 특별한 이상 현상(anomaly)이나 고고학 유적지(archaeological
  site)를 발견할 수 있습니다. (초반 해금, 특별한 조건 없이 발견)'
- '다챠 (Dacha): 6개의 가이아 행성을 포함하는 고립된 성계로, 헬리토(Helito) 성계의 독특한 이상 현상을 완료해야 접근이 해금됩니다.
  (중반 해금, 특정 이벤트 완료)'
- '자남 (Zanaam): 가이아 행성인 자남의 계곡(Valley of Zanaam)을 포함하며, 강력한 수호 함대인 ''자남의 수호자(Guardians
  of Zanaam)''가 지키고 있습니다. (중반 해금, 발견 시 전투 가능)'
- '생츄어리 (Sanctuary): 외계종 애호 몰락 제국(Xenophilic Fallen Empire)의 소유였던 것으로 추정되는 버려진 링월드(Ring
  World)를 포함하며, 자동 방어 시스템이 지키고 있습니다. (중반 해금, 발견 시 방어 시스템과 교전 가능)'
- 'L-성단 (L-Clusters): L-게이트(L-Gates)를 통해 접근할 수 있는 고립된 성계들의 집합으로, 특수 자원이나 ''회색 폭풍(Gray
  Tempest)''과 같은 강력한 위협을 포함할 수 있습니다. (중후반 해금, L-게이트 기술 연구 및 활성화)'
- '몰락 제국 모성 (Fallen Empire Homeworlds): 은하 내에 존재하는 몰락 제국(Fallen Empire)들의 본성계로, 엄청난
  기술력과 강력한 함선, 고대 건축물들을 보유하고 있으며, 후반 게임에 주요 공략 대상이 됩니다. (초중반 발견, 후반 공략)'
- '선구자 모성계 (Precursor Homeworlds): 특정 선조(Precursor) 이벤트 체인(Event Chain)을 완료하면 발견할
  수 있는 성계로, 선조 문명의 유물이나 기술을 얻을 수 있습니다. (중반 해금, 특정 유물 프로젝트 완료)'
- '블랙홀/중성자별 성계 (Black Hole/Neutron Star Systems): 항성 유형에 따라 성계 내 행성이나 탐사에 영향을 주는 고유한
  물리학적 특성을 가지며, 특정 기술 연구에 이점을 주기도 합니다. (초중반 해금, 일반적인 탐사로 발견)'
- '울티마 비질리스 (Ultima Vigilis): 컨틴전시(Contingency) 위기의 핵심 성계와 유사한 모습을 가지며, 25% 확률로 생성됩니다.
  (후반 해금, 탐사로 발견)'
- '위기 발생 지점 (Crisis Spawn Points): 프레소린 스컬지(Prethoryn Scourge), 컨틴전시(Contingency),
  언비든(Unbidden)과 같은 후반 위기(End-game Crisis)가 발생하는 지점으로, 은하 내 무작위 위치에 특정 조건 충족 시 등장합니다.
  (후반 해금, 특정 시점 및 조건 충족)'
enemies:
- '프레소린 스컬지 (Prethoryn Scourge): 은하를 침공하여 모든 생명체를 게걸스럽게 먹어치우는 외계 함대 종말 위기.'
- '이차원 침략자 (Extradimensional Invaders / Unbidden): 장막 너머의 다른 차원에서 넘어와 에너지를 흡수하는 존재들로
  이루어진 종말 위기.'
- '컨틴전시 (The Contingency): 은하의 ''특이점 이벤트''를 방지하기 위해 프로그램된 고대 기계 지능으로, 모든 유기체 및 합성체
  생명체를 절멸시키려 하는 종말 위기.'
- '합성체 여왕 세타나 (Cetana: The Synthetic Queen): 합성체 제국의 특이한 발전으로 인해 발생하는 종말 위기.'
- '우주 용 (Space Dragon): 특정 성계를 지키는 거대 우주 생명체이자 거대괴수.'
- '공허 구름 (Void Cloud): 우주를 떠다니는 거대한 에너지 생명체.'
- '티얀키 (Tiyanki): ''우주 고래''로 불리는 중립적인 우주 생명체로, 가스 행성에서 기체를 섭취하지만 공격 시 적대적으로 변할 수 있다.'
- '그레이 템페스트 (Gray Tempest): L-성단을 통해 나타날 수 있는 강력한 나노봇 함대로 구성된 중반 위기.'
- '영원한 축적자 (The Eternal Recurrence): 특정 렐릭과 관련된 강력한 우주 거대괴수.'
- '사이브렉스 (Cybrex): 선구자 종족 이벤트에서 등장하는 고대 기계 문명으로, 플레이어의 위기가 될 수도 있다.'
- '야생 프레소린 (Feral Prethoryn): 프레소린 스컬지 위기의 하위 유형으로, 은하계에 잔존하는 야생화된 프레소린 함대.'
- '엔클레이브 수호자 (Enclave Guardian): 큐레이터, 예술가, 상인 엔클레이브를 보호하는 함선이나 방어 플랫폼으로, 공격 시 적대적으로
  변한다.'
skills:
- '에너지 무기 (Energy Weapons): 레이저, 플라즈마 등 방어막에 약하지만 장갑에 효과적인 무기 체계.'
- '실탄형 무기 (Kinetic Weapons): 키네틱 포, 자동 캐논 등 방어막에 강력하지만 장갑에는 약한 무기 체계.'
- '미사일/어뢰 (Missiles / Torpedoes): 방어막을 무시하고 선체에 직접 피해를 줄 수 있는 무기 체계.'
- '보호막 (Shields): 함선의 방어 체계 중 하나로, 에너지 무기에 취약하고 실탄 무기에 강하다.'
- '장갑 (Armor): 함선의 방어 체계 중 하나로, 실탄 무기에 취약하고 에너지 무기에 강하다.'
- '함선 추진기 (Ship Thrusters): 함선의 이동 속도와 전투 시 회피율에 영향을 주는 핵심 부품.'
- '하이퍼드라이브 (Hyperdrive): 성계 간 이동을 가능하게 하는 초광속 항해 기술.'
- '승천 특전 (Ascension Perks): 전통 트리를 완성하거나 기술 개발로 얻는 강력한 제국 보너스.'
- '정신력 우위 (Psionic Ascension): 종족에게 초능력을 부여하고 장막(Shroud)에 접근할 수 있게 하는 승천 경로.'
- '합성 진화 (Synthetic Evolution): 종족의 의식을 로봇 신체로 옮겨 완전한 합성체로 진화하는 승천 경로.'
- '생체 형태 (Biological Ascension): 유전자 편집을 통해 종족 특성을 조작하고 완벽하게 만드는 승천 경로.'
- '콜로서스 (Colossus): 행성을 파괴하거나 개조할 수 있는 거대 함선.'
- '우월 전통 (Supremacy Tradition): 군사력 증강과 함대 능력 향상에 중점을 둔 전통 트리.'
- '발견 전통 (Discovery Tradition): 탐험과 연구 속도 향상에 중점을 둔 전통 트리.'
chat_tips:
- 게임을 시작하자마자 외계 종족을 발견하면 '제노 혐오' 또는 '숙청'과 같은 채팅 반응이 흔히 나타납니다.
- 플레이어가 콜로서스(행성 파괴 무기)를 사용하거나 다른 대규모 파괴를 저지를 때 '전쟁 범죄' 또는 '또다시 전쟁 범죄!'와 같은 유머러스한 반응이
  나옵니다.
- 스페이스 아메바 '버블스'를 입양했을 때 채팅창에서는 '버블스는 소중해', '버블스를 죽이지 마!'와 같은 보호적인 반응을 보입니다.
- 어려운 최종 위기(Endgame Crisis)가 발생하면 시청자들은 '맙소사, 다들 침착해!', '젠장, 망했어'와 같이 당황하거나 비장한 반응을
  보입니다.
- 플레이어가 은하계를 정화하거나 자신의 제국으로 통일하려 할 때 '황제 폐하를 위하여!' (For the Emperor!)와 같은 Warhammer
  40k 관련 밈을 사용합니다.
- AI 제국들이 쓸데없이 많은 서식지(Habitats)를 건설하여 성계 화면을 지저분하게 만들면 'AI 서식지 좀 그만 지어!', '서식지 제거반
  출동!'과 같은 불만을 표출합니다.
- 초반에 강력한 이웃 제국이나 '광적인 정화자'(Fanatic Purifiers)를 만나면 '벌써 숙청각이냐', '망겜이네'와 같이 좌절하거나 체념하는
  반응이 나옵니다.
- 연구 속도가 느려지거나 특정 기술을 개발하는 데 너무 오랜 시간이 걸릴 때 '이거 연구하는 데 51년 걸리겠네'와 같은 드립을 칩니다.
- 게임을 지배하거나 은하 공동체에서 압도적인 영향력을 행사할 때 '내가 곧 원로원이다'(I am the Senate)와 같은 스타워즈 밈을 사용합니다.
- 게임을 시작한 지 얼마 안 되어 위기(Crisis)가 올 것 같지 않거나 지루할 때 '위기가 안 와? 그럼 우주를 없애버린다!'와 같은 극단적인
  밈이 나타납니다.
- 블로르그(Blorg) 종족이 등장하거나 언급될 때 '친구를 강요하는 종족', '친구해줄게'(Friends?)와 같은 블로르그 특유의 밈을 공유합니다.
- 귀엽게 생긴 파충류 종족인 '프리크키키-티'(Prikkiki-ti)가 광적인 정화자로 등장하면 '댄싱 제노'라 부르며 아이러니한 상황에 웃음을
  터뜨립니다.
- 경제 관리에 실패하여 자원이 마이너스가 될 때 '-1k 에너지 크레딧'과 같이 현재 상황을 직접적으로 언급하며 절망합니다.
- 플레이어가 대규모 함대를 성공적으로 운용하거나 압도적인 전력으로 적을 제압할 때 '대함대 간다', '싸울 시간이다 얘들아!' (It's clobbering
  time boys!)와 같이 환호합니다.
- Stellaris의 줄임말이나 'Xeno'와 같이 게임 내에서 자주 쓰이는 용어는 자연스럽게 채팅에서 사용되며, 특히 'Xeno'는 외계 종족을
  비하하는 밈으로 활용되기도 합니다.
- 메가코프(Megacorp) 플레이어가 이윤을 극대화하기 위해 다소 비윤리적인 행동을 할 때 '기업의 사악함' 또는 '돈이 최고'와 같은 반응이
  나옵니다.
- 과학선이 고고학 유적지를 탐사할 때 '고고학적 현장 발굴' 또는 '또 유물 나왔나?'와 같이 기대감을 표현합니다.
- 후반 게임에서 AI가 이상한 행동을 하거나 비효율적인 제국 운영을 보일 때 'AI 바보', 'AI는 늘 병맛'과 같은 비판적인 유머를 사용합니다.
