name: 'Wuthering Waves (명조: 워더링 웨이브)'
description: KURO GAMES가 개발한 오픈월드 액션 RPG입니다. 대재앙 '비명'으로 황폐해진 세상에서 기억을 잃은 방랑자가 되어,
  다양한 공명자들과 함께 잃어버린 기억을 되찾고 세상을 바꾸기 위한 여정을 떠납니다. 높은 자유도의 탐험과 빠르고 부드러운 전투가 특징입니다.
vision_focus:
- 환경 및 지역 특성 (배경 색상·지형·건물 양식, 시간대, 날씨 — 설원/사막/폐허/도시, 낮/밤, 맑음/비 등)
- 플레이어 캐릭터 상태 (캐릭터 초상화, 체력/스태미나 바, 활성화된 버프/디버프 아이콘 — 초록/빨강 계열, 특정 아이콘 모양)
- 전투 상황 정보 (화면 내 적 종류·수·체력 바, 적에게 적용된 상태 이상 — 빙결/연소/감전 이펙트, 아군 스킬 쿨타임 및 궁극기 게이지)
- UI 내 핵심 정보 (미니맵 — 플레이어 위치/목표/POI, 퀘스트 목표 텍스트, 현재 선택된 메뉴 — 탭 강조 효과)
- 상호작용 가능한 객체 (수집 가능한 자원 — 광물/식물 고유 색상/형태, 상호작용 프롬프트 아이콘, 열린/닫힌 상자/문 상태)
- 데미지 및 효과 표시 (공격 성공 시 데미지 숫자 — 크리티컬/일반/속성 데미지 색상/크기, 피격 시 화면 효과)
- 현재 속성/원소 모드 (화면 테두리 색상, 속성 아이콘, 해당 속성 스킬 활성화 여부)
systems:
- '일반 공격 (Normal Attack): 가장 기본적인 공격으로, 캐릭터마다 고유한 공격 스타일과 콤보를 가지고 있으며, 강공격(Heavy Attack)과
  공중 공격(Mid-air Attack)으로 연계 가능합니다.'
- '회피 (Evasion): 적의 공격에 맞춰 대시 버튼을 눌러 발동하는 회피 기동으로, 저스트 회피 성공 시 잠시 무적 상태가 되며 회피 반격(Dodge
  Counter)으로 이어질 수 있습니다.'
- '패링 (Parry): 특정 적의 공격 타이밍에 맞춰 공격 버튼을 눌러 발동하는 반격 기술로, 성공 시 적의 공격을 방해하고 기절 상태로 만들
  수 있습니다.'
- '공명 스킬 (Resonance Skill): 캐릭터 고유의 액티브 스킬로, 대부분 코스트 없이 사용할 수 있으며 캐릭터에 따라 다양한 효과(딜,
  힐 등)를 가집니다.'
- '공명 해방 (Resonance Liberation): 캐릭터의 궁극기로, 공명 에너지(Resonance Energy)를 모두 채우면 사용할 수
  있으며 강력한 피해를 주거나 팀 전체에 이로운 효과를 부여합니다.'
- '공명 회로 (Resonance Circuit / Forte Circuit): 캐릭터마다 고유한 게이지 시스템으로, 전투 중 특정 행동으로 게이지를
  채워 특수 공격을 강화하거나 추가 효과를 발동시킬 수 있습니다.'
- '협주 효과 (Concerto Effect): 캐릭터 교체 시 발동하는 팀 시너지 시스템으로, 퇴장하는 캐릭터의 반주 스킬(Outro Skill)과
  등장하는 캐릭터의 변주 스킬(Intro Skill)로 구성되어 다양한 버프와 연계 공격을 제공합니다.'
- '에코 시스템 (Echoes): 적을 처치하고 ''에코''를 흡수하여 캐릭터의 능력치를 강화하고, 에코 고유의 스킬을 사용하여 전투를 돕는 시스템입니다.
  특정 에코 세트 장착 시 세트 효과가 발동합니다.'
- '스테미나 (Stamina): 대시, 강공격, 벽 타기 등 이동 및 일부 전투 행동에 소모되는 자원으로, 시간이 지남에 따라 회복됩니다.'
- '유니온 레벨 (Union Level): 플레이어 계정의 전체적인 레벨로, 메인 스토리 진행, 퀘스트 완료, 웨이브플레이트(Waveplates)
  소모 등으로 경험치를 얻을 수 있으며, 특정 레벨 달성 시 새로운 콘텐츠가 해금되고 보상이 증가합니다.'
- '데이터 뱅크 (Data Bank): 흡수한 에코의 종류와 희귀도에 따라 레벨이 오르는 시스템으로, 레벨이 높을수록 더 높은 등급의 에코를 획득할
  확률이 증가합니다.'
- '레조네이터 승진 (Resonator Ascension): 캐릭터의 최대 레벨을 확장하고 기본 능력치를 강화하는 성장 시스템입니다.'
- '무기 시스템 (Weapon System): 각 캐릭터는 한 종류의 무기를 장착할 수 있으며, 무기 자체의 능력치와 고유 효과를 통해 캐릭터의
  전투력을 증대시킬 수 있습니다.'
- '공명자 레벨업 (Resonator Level Up): 공명자의 전투력을 높이기 위한 기본적인 성장 시스템으로, 경험치 아이템을 사용하여 레벨을
  올립니다.'
- '파티 시스템 (Party System): 최대 3명의 공명자로 팀을 구성하여 전투에 참여하며, 각 캐릭터의 역할과 스킬을 조합하여 전략적인 전투를
  수행합니다.'
- '부조화 메커니즘 (Disorder Mechanism): 새로운 전투 메커니즘으로 소개되었으며, 게임의 전략적 깊이를 더할 것으로 예상됩니다.'
locations:
- '솔라리스-3 (Solaris-3): 비명(Lament)이라는 대재앙으로 인해 대부분의 인류가 사라지고 미지의 존재들이 나타난 미래, 포스트 아포칼립스
  세계관의 주 배경이 되는 행성입니다.'
- '금주 (Jinzhou): 명조:워더링 웨이브의 첫 공개 지역이자 주요 활동 거점으로, 새로운 문명과 과거의 흔적이 융합된 도시 테마를 가지고
  있습니다.'
- '역경의 탑 (Tower of Adversity): 유니온 레벨 15 달성 및 ''심연 속의 고독'' 퀘스트 완료 시 해금되는 엔드게임 콘텐츠
  던전으로, 난이도에 따라 스테이블 존(Stable Zone), 실험 존(Experimental Zone), 위험 존(Hazard Zone)으로
  나뉘며 캐릭터 활용 제한 시스템인 ''활력(Vigor)''이 적용됩니다.'
- '딤르 평원 (Dimmr Plains): 게임 내 주요 지도 중 하나로, 다양한 수집품과 전투 콘텐츠가 존재하는 광활한 필드 지역입니다.'
- '황룡 (Huanglong): 명조:워더링 웨이브 세계관 내 주요 세력 중 하나이자 지역명으로, 게임 내에서 플레이어가 탐험하게 될 중요한 지역입니다.'
- '테티스의 심해 (Tethys'' Deep): 지도상에 존재하는 지역 중 하나로, 심해 테마의 독특한 환경과 관련 콘텐츠가 있을 것으로 예상됩니다.'
- '리나시타 (Rinascita): 2.0 버전 업데이트를 통해 추가된 신규 지역으로, 게임의 그래픽과 스토리 측면에서 큰 발전을 보여준 곳으로
  평가됩니다.'
- '볼트 지하 (Vault Underground): 지도상에 존재하는 지하 테마의 지역으로, 특정 던전이나 탐험 요소가 포함될 수 있습니다.'
- '우드베일 홀 (Woodveil Hall): 펌어먼트 산(Mt. Firmament) 아래에 위치한 접근 불가능했던 던전으로, 향후 업데이트에서
  해금될 가능성이 있으며 지하 구조와 특징적인 기념물, 붉은 잎 등이 있습니다.'
- '관점 왜곡 던전 (Perspective Bender Dungeon): 폭포 뒤 바위 안에 숨겨진 퍼즐 던전으로, 특정 퀘스트를 완료하여 바위를
  파괴해야 진입할 수 있습니다.'
- '공명 넥서스 (Resonance Nexus): 맵 곳곳에 존재하는 빠른 이동 지점(Fast Travel Point)으로, 캐릭터를 완전히 회복시키고
  탐험에 도움을 줍니다.'
- '공명 비콘 (Resonance Beacon): 맵 곳곳에 존재하는 탐험 요소로, 해금 시 탐험 진행도에 기여하고 보상을 제공합니다.'
- '검은 해안 (Black Shore): 1.3 버전 업데이트로 추가된 지역으로, 디자인과 스토리 측면에서 발전된 모습을 보여주었습니다.'
enemies:
- '타종 거북이 (Bell-Borne Geochelone): 거대한 거북이 형태의 주간 보스로, 강력한 지형 공격을 가합니다.'
- '스카 (Scar): 메인 퀘스트에서 등장하는 주간 보스로, 불 속성 공격을 사용합니다.'
- '무망자 (Dreamless): 메인 퀘스트 이후 해금되는 주간 보스로, 강력한 능력을 자랑합니다.'
- '크라운리스 (Crownless): 게임 초반에 만나는 첫 번째 메인 스토리 보스입니다.'
- '페이리안 베링갈 (Feilian Beringal): 민첩하고 강력한 근접 공격을 펼치는 야수형 보스입니다.'
- '뇌운의 비늘 (Thundering Mephis): 빠른 번개 기반 공격으로 플레이어를 압박하는 보스입니다.'
- '기동 병기: 가고일 (Sentry Construct: Gargoyle): 빠르고 다단 히트 근접 콤보와 장거리 빙결 투사체를 사용하는 기계형
  엘리트 몬스터입니다.'
- '인페르노 라이더 (Inferno Rider): 화염 기반 공격으로 플레이어를 압박하는 오토바이 탄 엘리트 보스입니다.'
- '황야의 으르렁 (Wasteland Bellower / Havoc Dreadmane): 늑대 형태의 엘리트 몬스터로, 초반 지역에서 만나는 도전적인
  적입니다.'
- '프리즘 하트 (Prism Heart / Elemental Prisms): 여러 개의 속성 프리즘으로 구성된 엘리트 몬스터로, 강력한 속성 공격을
  가합니다.'
- '잔성회의 추종자 (Fractsidus Follower / Remnant Star Disciple): 사이보그 형태의 엘리트 몬스터로, 원거리
  공격에 능합니다.'
- '산맥 호위 (Obelisk Guardian / Indomitable Guard): 거대한 바위 골렘 형태의 엘리트 몬스터입니다.'
skills:
- '일반 공격 (Normal Attack): 무기를 사용하여 적에게 지속적인 피해를 입히는 기본 공격입니다.'
- '강공격 (Heavy Attack): 스태미나를 소모하여 더 큰 피해를 주는 강력한 공격입니다.'
- '공명 스킬 (Resonance Skill): 각 캐릭터 고유의 활성 능력으로, 전투 중 공명 에너지를 생성합니다.'
- '공명 해방 (Resonance Liberation): 최대 공명 에너지로 발동하는 캐릭터의 궁극기로, 막대한 피해를 입히거나 팀을 강화합니다.'
- '공명 회로 (Resonance Circuit): 캐릭터별 특수 메커니즘으로, 특정 조건 충족 시 강화된 공격이나 효과를 발동합니다.'
- '회피 (Evasion): 적의 공격을 피하는 동시에 스태미나를 회복할 수 있는 방어 기술입니다.'
- '패링 (Parry): 적의 공격 직전에 공격 버튼을 눌러 적을 경직시키고 반격 기회를 얻는 기술입니다.'
- '변주 스킬 (Intro Skill): 다른 캐릭터로 교체 시 발동되며, 전투 진입과 함께 피해를 주거나 버프를 제공합니다.'
- '반주 스킬 (Outro Skill): 캐릭터가 전투에서 이탈할 때 발동되며, 다음 캐릭터나 팀 전체에 유용한 효과를 부여합니다.'
- '단근 - 연주하는 붉은 파편 (Danjin - Vermilion Shards): HP를 소모하여 공격하고, 공명 회로를 채워 강화된 공격 및
  HP 회복을 합니다.'
- '산화 - 얼음 조각 소환 (Sanhua - Ice Construct Summon): 얼음 구조물을 생성하고 폭파시켜 적에게 빙결 피해를 입힙니다.'
- '로버(인멸) - 그림자 일식 (Havoc Rover - Umbra Eclipse): 공명 회로를 채우면 강화 상태로 진입하여 기본 공격 및 스킬
  피해량이 크게 증가합니다.'
chat_tips:
- '일반적인 사망 연출 반응: "어떻게 또 죽냐", "F", "gg" 등의 반응이 스트리밍 채팅창에 올라옵니다.'
- '보스 등장 반응: 예상치 못한 보스(예: 엑소스트라이더)가 등장하면 시청자들은 "엑소스트라이더 왜 여기있죠?"와 같은 놀라움을 표합니다.'
- '하이라이트 순간 반응: 멋진 전투나 중요한 스토리 연출에는 "오 와 와 대박", "우와 씨발", "존나 멋있다"와 같은 격한 감탄사가 터져 나옵니다.'
- '커뮤니티 내 게임 밈 용어 (플로로 관련): ''플로로'' 캐릭터의 팬덤을 "로단"이라고 부르며, 그녀의 과거 행적을 미화하는 밈과 관련되어
  있습니다.'
- '커뮤니티 내 게임 밈 용어 (탕수육 관련): ''탕수육'' 아이템이 에코 흡수율을 높여주는 효과가 플로로의 스토리와 엮여 "탕수육 먹고 잔상
  파밍"이라는 잔인한 밈으로 사용됩니다.'
- '커뮤니티 내 게임 밈 용어 (금희 관련): ''금희'' 캐릭터는 "그뫼엥"이라 불리며 ''뫼엥''만 외치는 다소 어리숙한 캐릭터로 묘사되기도
  합니다.'
- '커뮤니티 내 게임 밈 용어 (카를로타 관련): ''카를로타''는 작은 키 때문에 "몇 카를"이라는 단위로 거리나 길이를 표현하는 밈에 사용됩니다.'
- '커뮤니티 내 게임 밈 용어 (기염 관련): ''기염'' 캐릭터의 대사 "기류를 타고 긴 밤을 넘어"는 커뮤니티에서 게시물 낚시나 특정 상황에
  비장하게 사용되는 밈입니다.'
- '커뮤니티 내 게임 밈 용어 (데니아 관련): ''데니아''는 가난하고 불쌍하다는 설정 때문에 "데니아 불쌍 밈"이 생겨 그녀의 어려운 상황을
  언급할 때 쓰입니다.'
- '팬덤에서 사용하는 별칭/줄임말 (게임): 게임 자체를 ''명조'' 대신 ''띵조''라고 부르는 야민정음 밈이 널리 사용되며, 공식에서도 인정할
  정도입니다.'
- '팬덤에서 사용하는 별칭/줄임말 (유저): ''명조:워더링 웨이브'' 마이너 갤러리 유저들은 스스로를 "띵붕이"라고 칭합니다.'
- '팬덤에서 사용하는 별칭/줄임말 (캐릭터): ''파수인'' 캐릭터는 종종 "파우웅"이라는 별명으로 불리며, ''아브''는 ''퍼리몬'' 또는 ''털시노''라고
  불리기도 합니다.'
- '정실 논쟁: 주인공인 방랑자의 ''진정한 정실''이 누구인지를 두고 팬덤 내에서 ''정실 논쟁''이 활발하게 펼쳐지며, 장리, 파수인, 카멜리아
  등이 주로 언급됩니다.'
- '음해 밈: 특정 캐릭터의 단점이나 부족한 성능을 지적하며 놀리는 "음해 밈"이 유행하며, 특히 감심, 앙코, 금희, 단근, 양양 등이 그 대상이
  되기도 합니다.'
- '현지화/오역 문제 반응: "현지화팀은 유행어나 밈은 아예 쓰지 마시죠" 또는 "번역이나 고쳐라"처럼 현지화의 품질이나 철 지난 밈 사용에 대한
  비판적인 반응이 나옵니다.'
- '성능 관련 반응: "풀돌 인증"은 캐릭터를 최고 성능으로 완성했음을 자랑하는 행위로, 강력한 캐릭터에 대한 만족감을 표현합니다.'
- '긍정적인 개발 피드백: 게임의 꾸준한 개선을 긍정적으로 평가하며 "명조는 매일 발전하고 있다는 거임. 진짜라는 거임"과 같은 반응을 보이기도
  합니다.'
- '보스전 BGM 감탄: 스토리의 중요한 보스전이나 연출에서 "와 브금 좆된다"와 같은 반응으로 배경 음악에 대한 긍정적인 평가를 표현합니다.'
- '게임의 유사성 언급: ''원신라이크''라는 용어로 게임 시스템의 유사성을 지적하거나, ''소울라이크''처럼 전투 난이도를 언급하기도 합니다.'
